<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AppFamilia Pro</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root { --gold: #d4af37; --dark: #121212; --gray: rgba(30, 30, 30, 0.9); --text: #e0e0e0; --red: #ff5252; --green: #4caf50; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { font-family: -apple-system, system-ui, sans-serif; background-color: var(--dark); color: var(--text); padding-bottom: 110px; padding-top: 80px; overflow-x: hidden; }
        
        /* FUNDO DINÂMICO NATIVO (SEM TRAVAMENTOS) */
        #bg-stars { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; background: radial-gradient(circle at center, #1a1a1a 0%, #121212 100%); overflow: hidden; }
        .star { position: absolute; background: var(--gold); border-radius: 50%; opacity: 0; animation: floatUp linear infinite; }
        @keyframes floatUp { 0% { transform: translateY(100vh) scale(0); opacity: 0; } 20% { opacity: 0.4; } 80% { opacity: 0.4; } 100% { transform: translateY(-10vh) scale(1.5); opacity: 0; } }

        /* CABEÇALHO MAIOR */
        .app-header { position: fixed; top: 0; left: 0; width: 100%; background: rgba(18, 18, 18, 0.9); backdrop-filter: blur(10px); padding: 20px; text-align: center; z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .app-header h1 { font-size: 1.5em; color: var(--gold); text-transform: uppercase; letter-spacing: 2px; }

        .app-container { padding: 15px; width: 100%; max-width: 600px; margin: 0 auto; }
        .view { display: none; flex-direction: column; gap: 20px; }
        .view.active { display: flex; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* CARTÕES */
        .card { background: var(--gray); padding: 25px 20px; border-radius: 20px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
        .card h2 { font-size: 1.4em; margin-bottom: 15px; }
        
        .balance-box { display: flex; justify-content: space-between; align-items: center; text-align: center; gap: 5px; }
        .balance-item h3 { font-size: 0.8em; color: #aaa; text-transform: uppercase; margin-bottom: 8px; }
        .balance-item p { font-size: 1.1em; font-weight: bold; }

        .form-group { display: flex; flex-direction: column; gap: 15px; }
        label { font-size: 0.9em; color: var(--gold); font-weight: bold; margin-bottom: -5px; margin-top: 5px; }
        input, select, button { width: 100%; padding: 18px; border-radius: 14px; border: 1px solid #444; font-size: 1.1em; background: rgba(0,0,0,0.4); color: white; outline: none; }
        input:focus, select:focus { border-color: var(--gold); background: rgba(0,0,0,0.6); }
        .btn { background: var(--gold); color: #000; font-weight: bold; border: none; text-transform: uppercase; cursor: pointer; font-size: 1.1em; letter-spacing: 1px; margin-top: 10px; }
        .btn:active { transform: scale(0.98); }
        
        .days-selector { display: flex; justify-content: space-between; gap: 8px; margin: 10px 0; }
        .day-btn { flex: 1; padding: 15px 0; border-radius: 12px; border: 1px solid #555; background: #222; color: #888; font-size: 1.1em; font-weight: bold; cursor: pointer; text-align: center; }
        .day-btn.active { background: var(--gold); color: black; border-color: var(--gold); }

        .item-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
        .list-item { background: rgba(255,255,255,0.05); padding: 18px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid var(--gold); }
        .registro-info b { font-size: 1.1em; color: white; display: block; margin-bottom: 4px; }
        .registro-data { font-size: 0.85em; color: #999; }

        .chart-container { position: relative; height: 280px; width: 100%; margin-top: 15px; }
        
        /* MENU INFERIOR */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(20, 20, 20, 0.98); display: flex; justify-content: space-around; padding: 15px 0 calc(15px + env(safe-area-inset-bottom)); border-top: 1px solid rgba(255,255,255,0.1); z-index: 1000; }
        .nav-item { color: #666; font-size: 0.85em; text-align: center; cursor: pointer; width: 25%; font-weight: 500; transition: 0.2s; }
        .nav-item.active { color: var(--gold); font-weight: bold; transform: translateY(-2px); }
        .nav-item span { display: block; font-size: 1.8em; margin-bottom: 6px; }
        
        .action-icon { font-size: 1.5em; padding: 10px; cursor: pointer; background: rgba(255,255,255,0.05); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-left: 10px; width: 45px; height: 45px; }
    </style>
</head>
<body>

    <div id="bg-stars"></div>
    <header class="app-header"><h1>AppFamilia Pro</h1></header>

    <div class="app-container">
        
        <div id="viewHome" class="view active">
            <div class="card balance-box">
                <div class="balance-item"><h3>Ganhos</h3><p id="resumoGanho" style="color:var(--green)">R$ 0</p></div>
                <div class="balance-item"><h3>Saldo</h3><p id="resumoSaldo" style="font-size: 1.4em;">R$ 0</p></div>
                <div class="balance-item"><h3>Gastos</h3><p id="resumoGasto" style="color:var(--red)">R$ 0</p></div>
            </div>
            <div class="card"><div class="chart-container"><canvas id="monthlyChart"></canvas></div></div>
            <div class="card">
                <h2>Registros do Mês</h2>
                <ul id="finList" class="item-list" style="margin-top:10px;"></ul>
            </div>
        </div>

        <div id="viewLancamento" class="view">
            <div class="card">
                <h2>Novo Lançamento</h2>
                <div class="form-group">
                    <label>Tipo de Movimentação</label>
                    <select id="finType"><option value="gasto">🔴 Saída / Gasto</option><option value="ganho">🟢 Entrada / Salário</option></select>
                    
                    <label>Descrição</label>
                    <input type="text" id="finDesc" placeholder="Ex: Aluguel, Mercado">
                    
                    <label>Valor (R$)</label>
                    <input type="number" id="finValue" placeholder="0.00" inputmode="decimal">
                    
                    <label>Frequência</label>
                    <select id="finFreq" onchange="document.getElementById('divEndDate').style.display = (this.value === 'fixo') ? 'flex' : 'none';">
                        <option value="mes">📅 Apenas este mês</option>
                        <option value="fixo">📌 Fixo / Parcelado</option>
                    </select>
                    
                    <div id="divEndDate" style="display:none; flex-direction: column; gap:10px;">
                        <label>Válido até (Mês da última parcela)</label>
                        <input type="month" id="finEndDate">
                    </div>
                    
                    <button class="btn" onclick="addFinance()">Gravar Finança</button>
                </div>
            </div>
        </div>

        <div id="viewAnual" class="view">
            <div class="card">
                <h2>Planejamento Anual 2026</h2>
                <div class="chart-container" style="height: 400px;"><canvas id="annualChart"></canvas></div>
            </div>
        </div>

        <div id="viewTarefas" class="view">
            <div class="card">
                <h2>Novo Lembrete 🔔</h2>
                <div class="form-group">
                    <input type="text" id="taskInput" placeholder="O que eu preciso lembrar?">
                    <input type="time" id="taskTime">
                    
                    <p style="font-size: 0.9em; color: var(--gold); margin-top: 5px; font-weight: bold;">Repetir nos dias:</p>
                    <div class="days-selector">
                        <div class="day-btn" data-day="0">D</div><div class="day-btn" data-day="1">S</div><div class="day-btn" data-day="2">T</div><div class="day-btn" data-day="3">Q</div><div class="day-btn" data-day="4">Q</div><div class="day-btn" data-day="5">S</div><div class="day-btn" data-day="6">S</div>
                    </div>
                    
                    <button class="btn" onclick="addTask()">Salvar Lembrete</button>
                    <button class="btn" style="background:rgba(255,255,255,0.1); color:white; font-size:0.9em; border: 1px solid #555; margin-top: 5px;" onclick="testSound()">🔊 Testar Som do Alarme</button>
                </div>
            </div>
            
            <div class="card" style="background:transparent; border:none; padding:10px 0;">
                <h2 style="margin-bottom:15px; padding-left: 5px;">Lembretes Ativos</h2>
                <ul id="taskList" class="item-list"></ul>
            </div>
        </div>

    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="window.navTab('viewHome', this)"><span>🏠</span>Início</div>
        <div class="nav-item" onclick="window.navTab('viewLancamento', this)"><span>➕</span>Finanças</div>
        <div class="nav-item" onclick="window.navTab('viewAnual', this)"><span>📊</span>Anual</div>
        <div class="nav-item" onclick="window.navTab('viewTarefas', this)"><span>📅</span>Agenda</div>
    </nav>

    <script>
        // CONFIGURAÇÃO DO FIREBASE MANTIDA INTACTA
        const firebaseConfig = {
            apiKey: "AIzaSyBGKDP5V75gMI7uO4gpZL6IpV3teP6J4ao",
            authDomain: "appfamilia-5ebe4.firebaseapp.com",
            databaseURL: "https://appfamilia-5ebe4-default-rtdb.firebaseio.com",
            projectId: "appfamilia-5ebe4",
            storageBucket: "appfamilia-5ebe4.firebasestorage.app",
            messagingSenderId: "588166444818",
            appId: "1:588166444818:web:4dcc01e0c6d1608cbc65cb"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();
        const alertSound = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

        // FUNDO DINÂMICO SEGURO (CSS PURE + JS NATIVO)
        function createStars() {
            const container = document.getElementById('bg-stars');
            for(let i=0; i<30; i++) {
                let star = document.createElement('div');
                star.className = 'star';
                let size = Math.random() * 4 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + 'vw';
                star.style.animationDuration = (Math.random() * 5 + 3) + 's';
                star.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(star);
            }
        }

        // NAVEGAÇÃO BLINDADA
        window.navTab = function(viewId, element) {
            try {
                document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                element.classList.add('active');
                document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
                document.getElementById(viewId).classList.add('active');
                
                if(viewId === 'viewHome') { fetchMonthly(); }
                if(viewId === 'viewAnual') { fetchAnnual(); }
                if(viewId === 'viewTarefas') { fetchTasks(); }
                window.scrollTo(0,0);
            } catch(e) {
                console.error("Erro ao mudar aba:", e);
            }
        };

        // --- FINANÇAS ---
        async function addFinance() {
            try {
                const type = document.getElementById('finType').value;
                const desc = document.getElementById('finDesc').value || "Sem Descrição";
                const valInput = document.getElementById('finValue').value;
                const val = parseFloat(valInput.replace(',', '.')) || 0;
                const freq = document.getElementById('finFreq').value;
                const end = document.getElementById('finEndDate').value;
                
                if (val === 0) return alert("Digite um valor válido!");

                await db.ref("financas").push({
                    tipo: type, descricao: desc, valor: val, frequencia: freq,
                    dataTermino: freq === 'fixo' ? end : '',
                    dataCriacao: firebase.database.ServerValue.TIMESTAMP,
                    mesCriacao: new Date().toISOString().substring(0, 7)
                });
                alert("Sucesso!");
                document.getElementById('finDesc').value = '';
                document.getElementById('finValue').value = '';
                window.navTab('viewHome', document.querySelector('.nav-item'));
            } catch(e) { alert("Erro ao salvar: " + e.message); }
        }

        let monthlyChart;
        async function fetchMonthly() {
            try {
                const currentMonth = new Date().toISOString().substring(0, 7);
                const list = document.getElementById('finList'); 
                list.innerHTML = '';
                let gan = 0, gas = 0;

                const snap = await db.ref("financas").once('value');
                if(!snap.exists()) {
                    list.innerHTML = "<p style='text-align:center;color:#888;'>Nenhum registro ainda.</p>";
                    renderMonthlyChart(0, 0);
                    return;
                }

                snap.forEach(c => {
                    try {
                        const f = c.val();
                        if(!f) return;
                        
                        let ativo = false;
                        if (!f.frequencia) { ativo = true; } 
                        else {
                            ativo = (f.frequencia === 'mes' && f.mesCriacao === currentMonth) || 
                                    (f.frequencia === 'fixo' && f.mesCriacao <= currentMonth && (!f.dataTermino || f.dataTermino >= currentMonth));
                        }

                        if (ativo) {
                            const valorReal = parseFloat(f.valor) || 0;
                            if (f.tipo === 'ganho') gan += valorReal; else gas += valorReal;
                            const freqTexto = !f.frequencia ? 'Registro Antigo' : (f.frequencia === 'fixo' ? 'Recorrente' : 'Mensal');
                            
                            list.innerHTML += `<li class="list-item" style="border-left-color:${f.tipo==='ganho'?'var(--green)':'var(--red)'}">
                                <div class="registro-info"><b>${f.descricao || 'Sem Descrição'}</b><span class="registro-data">${freqTexto}</span></div>
                                <div style="display:flex;align-items:center;"><b style="font-size:1.1em;">R$ ${valorReal.toFixed(2)}</b><div class="action-icon" onclick="deleteFin('${c.key}')">🗑️</div></div>
                            </li>`;
                        }
                    } catch(e) {}
                });

                document.getElementById('resumoGanho').innerText = `R$ ${gan.toFixed(2)}`;
                document.getElementById('resumoGasto').innerText = `R$ ${gas.toFixed(2)}`;
                const saldo = gan - gas;
                document.getElementById('resumoSaldo').innerText = `R$ ${saldo.toFixed(2)}`;
                document.getElementById('resumoSaldo').style.color = saldo >= 0 ? 'var(--green)' : 'var(--red)';
                renderMonthlyChart(gan, gas);
            } catch(e) { console.error(e); }
        }

        function renderMonthlyChart(gan, gas) {
            try {
                if (typeof Chart === 'undefined') return;
                const ctx = document.getElementById('monthlyChart').getContext('2d');
                if (monthlyChart) monthlyChart.destroy();
                if(gan === 0 && gas === 0) { gan = 1; gas = 1; }
                monthlyChart = new Chart(ctx, { type: 'doughnut', data: { labels: ['Ganhos', 'Gastos'], datasets: [{ data: [gan, gas], backgroundColor: ['#4caf50', '#ff5252'], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false, cutout: '80%', plugins: { legend: { position: 'bottom', labels: { color: '#fff', font: { size: 14 } } } } } });
            } catch(e) {}
        }

        // --- ANUAL ---
        let annualChart;
        async function fetchAnnual() {
            try {
                const meses = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
                const ganAnual = new Array(12).fill(0); const gasAnual = new Array(12).fill(0);
                const snap = await db.ref("financas").once('value');
                
                snap.forEach(c => {
                    try {
                        const f = c.val(); if(!f) return;
                        const valorReal = parseFloat(f.valor) || 0;
                        let mesCriacaoReal = f.mesCriacao || (f.data ? new Date(f.data).toISOString().substring(0, 7) : null);

                        for (let i = 0; i < 12; i++) {
                            const mesLoop = `2026-${(i + 1).toString().padStart(2, '0')}`;
                            let ativo = false;
                            
                            if (!f.frequencia && mesCriacaoReal === mesLoop) ativo = true; 
                            else if ((f.frequencia === 'mes' && f.mesCriacao === mesLoop) || (f.frequencia === 'fixo' && f.mesCriacao <= mesLoop && (!f.dataTermino || f.dataTermino >= mesLoop))) ativo = true;

                            if (ativo) { if (f.tipo === 'ganho') ganAnual[i] += valorReal; else gasAnual[i] += valorReal; }
                        }
                    } catch(e){}
                });

                if (typeof Chart === 'undefined') return;
                const ctx = document.getElementById('annualChart').getContext('2d');
                if (annualChart) annualChart.destroy();
                annualChart = new Chart(ctx, { type: 'bar', data: { labels: meses, datasets: [{ label: 'Ganhos', data: ganAnual, backgroundColor: '#4caf50' }, { label: 'Gastos', data: gasAnual, backgroundColor: '#ff5252' }] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { ticks: { color: '#aaa' } }, x: { ticks: { color: '#aaa' } } }, plugins: { legend: { labels: { color: '#fff' } } } } });
            } catch(e) {}
        }

        // --- TAREFAS ---
        const selectedDays = [];
        document.querySelectorAll('.day-btn').forEach(btn => {
            btn.onclick = () => {
                const day = parseInt(btn.dataset.day);
                btn.classList.toggle('active');
                if (selectedDays.includes(day)) selectedDays.splice(selectedDays.indexOf(day), 1); else selectedDays.push(day);
            };
        });

        async function addTask() {
            try {
                const txt = document.getElementById('taskInput').value || "Lembrete";
                const time = document.getElementById('taskTime').value;
                if (!time) return alert("Preencha pelo menos a hora!");
                
                await db.ref("tarefas").push({ texto: txt, hora: time, dias: selectedDays, ultimoToque: "" });
                document.getElementById('taskInput').value = ''; fetchTasks();
                if (Notification.permission !== "granted") Notification.requestPermission();
            } catch(e){}
        }

        async function fetchTasks() {
            try {
                const list = document.getElementById('taskList'); list.innerHTML = '';
                const diasNome = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
                const snap = await db.ref("tarefas").once('value');
                
                snap.forEach(c => {
                    try {
                        const t = c.val(); if(!t) return;
                        let dTxt = 'Sem Repetição';
                        if(t.dias && Array.isArray(t.dias) && t.dias.length > 0) { dTxt = t.dias.map(d => diasNome[d]).join(', '); }
                        
                        list.innerHTML = `<li class="list-item"><div><b>${t.texto || 'Sem descrição'}</b><br><small style="font-size: 0.9em; color:#bbb;">⏰ ${t.hora || '--:--'} (${dTxt})</small></div><div class="action-icon" onclick="deleteTask('${c.key}')" style="background:rgba(76, 175, 80, 0.2);">✅</div></li>` + list.innerHTML;
                    } catch(e) {}
                });
            } catch(e){}
        }

        // --- ROTINAS E STARTUP ---
        setInterval(() => {
            try {
                const agora = new Date();
                const d = agora.getDay();
                const h = agora.getHours().toString().padStart(2, '0') + ":" + agora.getMinutes().toString().padStart(2, '0');
                const uni = agora.getFullYear() + "-" + agora.getMonth() + "-" + agora.getDate() + "-" + agora.getHours() + "-" + agora.getMinutes();

                db.ref("tarefas").once('value', snap => {
                    snap.forEach(c => {
                        const t = c.val();
                        if (t && t.hora === h && t.dias && t.dias.includes(d) && t.ultimoToque !== uni) {
                            alertSound.play().catch(() => {});
                            if (Notification.permission === "granted") new Notification("AppFamilia: " + (t.texto||''));
                            db.ref("tarefas").child(c.key).update({ ultimoToque: uni });
                        }
                    });
                });
            } catch(e){}
        }, 30000);

        function testSound() { alertSound.play().catch(() => alert("Toque na tela para liberar o áudio no celular!")); }
        async function deleteFin(id) { if(confirm("Apagar?")) { await db.ref("financas").child(id).remove(); fetchMonthly(); } }
        async function deleteTask(id) { if(confirm("Apagar?")) { await db.ref("tarefas").child(id).remove(); fetchTasks(); } }

        window.onload = () => {
            createStars();
            try { fetchMonthly(); } catch(e){}
            try { fetchTasks(); } catch(e){}
        };
    </script>
</body>
</html>
