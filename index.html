<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>BrimBot IA</title>

    <style>
        :root {
            --bg-main: #000;
            --bg-card: #1c1c1e;
            --text-main: #fff;
            --text-dim: #8e8e93;
            --accent: #0a84ff;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:-apple-system, BlinkMacSystemFont, sans-serif;
        }

        body{
            background:var(--bg-main);
            color:var(--text-main);
            height:100vh;
            display:flex;
            flex-direction:column;
        }

        .header{
            padding:20px;
            background:var(--bg-card);
            border-bottom:1px solid #333;
            text-align:center;
        }

        .header h1{
            font-size:18px;
            letter-spacing:1px;
        }

        .header span{
            color:var(--accent);
            font-size:12px;
            font-weight:bold;
        }

        #chat-container{
            flex:1;
            overflow-y:auto;
            padding:20px;
            display:flex;
            flex-direction:column;
            gap:15px;
        }

        .bubble{
            max-width:85%;
            padding:15px;
            border-radius:18px;
            line-height:1.5;
            font-size:15px;
            word-wrap:break-word;
        }

        .user-bubble{
            align-self:flex-end;
            background:var(--accent);
            border-bottom-right-radius:4px;
        }

        .ai-bubble{
            align-self:flex-start;
            background:var(--bg-card);
            border:1px solid #333;
            border-bottom-left-radius:4px;
        }

        .input-box{
            padding:15px;
            background:var(--bg-card);
            display:flex;
            gap:10px;
            padding-bottom:calc(15px + env(safe-area-inset-bottom));
        }

        input{
            flex:1;
            background:#2c2c2e;
            border:none;
            padding:15px 20px;
            border-radius:25px;
            color:white;
            outline:none;
            font-size:15px;
        }

        button{
            width:50px;
            height:50px;
            border-radius:50%;
            border:none;
            background:var(--accent);
            color:white;
            cursor:pointer;
            font-size:20px;
        }

        button:disabled{
            background:#333;
            cursor:not-allowed;
        }

        .loading{
            display:none;
            padding-left:20px;
            padding-bottom:10px;
            color:var(--text-dim);
            font-style:italic;
            font-size:13px;
        }

        pre{
            background:#000;
            border:1px solid #333;
            padding:12px;
            border-radius:10px;
            overflow-x:auto;
            margin-top:10px;
        }

        code{
            color:#00d4ff;
            font-family:monospace;
            font-size:13px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>BrimBot</h1>
        <span>🟢 Gemini 1.5 Flash</span>
    </div>

    <div id="chat-container">

        <div class="bubble ai-bubble">
            Sistema iniciado com sucesso 🚀<br>
            Pode mandar sua pergunta.
        </div>

    </div>

    <div id="loadingIndicator" class="loading">
        Pensando...
    </div>

    <div class="input-box">
        <input
            type="text"
            id="userInput"
            placeholder="Digite sua pergunta..."
            onkeypress="if(event.key==='Enter') sendPrompt()"
        >

        <button id="sendBtn" onclick="sendPrompt()">
            ➤
        </button>
    </div>

<script>

    /*
    ==========================================
    IMPORTANTE
    ==========================================

    NÃO deixe sua chave pública em produção.

    O ideal é:
    Frontend -> Backend -> Gemini API

    ==========================================
    */

    const API_KEY = "SUA_API_KEY_AQUI";

    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const loadingIndicator = document.getElementById('loadingIndicator');

    // Histórico da conversa
    let history = [];

    async function sendPrompt(){

        const text = userInput.value.trim();

        if(!text) return;

        appendMessage(text, 'user-bubble');

        history.push({
            role: "user",
            parts: [{ text }]
        });

        userInput.value = '';

        sendBtn.disabled = true;

        loadingIndicator.style.display = 'block';

        chatContainer.scrollTop = chatContainer.scrollHeight;

        try{

            // MODELO NOVO
            const url =
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

            const response = await fetch(url, {

                method: 'POST',

                headers:{
                    'Content-Type':'application/json'
                },

                body: JSON.stringify({

                    contents: history,

                    generationConfig:{
                        temperature:0.8,
                        maxOutputTokens:800
                    }

                })

            });

            // erro API
            if(!response.ok){

                const errorData = await response.json();

                throw new Error(
                    errorData.error?.message ||
                    'Erro desconhecido da API'
                );
            }

            const data = await response.json();

            console.log(data);

            // proteção contra respostas vazias
            const aiText =
                data?.candidates?.[0]?.content?.parts?.[0]?.text
                || "A IA não retornou resposta.";

            appendMessage(aiText, 'ai-bubble');

            // salva resposta no histórico
            history.push({
                role: "model",
                parts: [{ text: aiText }]
            });

        }
        catch(error){

            console.error(error);

            appendMessage(
                `❌ Erro: ${escapeHtml(error.message)}`,
                'ai-bubble'
            );
        }
        finally{

            sendBtn.disabled = false;

            loadingIndicator.style.display = 'none';

            userInput.focus();

            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    }

    // ESCAPE XSS
    function escapeHtml(text){

        const div = document.createElement('div');

        div.innerText = text;

        return div.innerHTML;
    }

    function appendMessage(text, className){

        const div = document.createElement('div');

        div.className = `bubble ${className}`;

        // segurança anti XSS
        let safeText = escapeHtml(text);

        // markdown básico
        safeText = safeText

            // bloco código
            .replace(
                /```([\s\S]*?)```/g,
                '<pre><code>$1</code></pre>'
            )

            // negrito
            .replace(
                /\*\*(.*?)\*\*/g,
                '<b>$1</b>'
            )

            // quebra linha
            .replace(/\n/g, '<br>');

        div.innerHTML = safeText;

        chatContainer.appendChild(div);

        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

</script>

</body>
</html>
