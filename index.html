<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AppFamilia Pro</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

    <style>
        :root { --gold: #d4af37; --dark: #121212; --gray: rgba(30, 30, 30, 0.9); --text: #e0e0e0; --red: #ff5252; --green: #4caf50; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { font-family: -apple-system, system-ui, sans-serif; background-color: var(--dark); color: var(--text); padding-bottom: 90px; padding-top: 60px; overflow-x: hidden; }
        #particles-js { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

        .app-header { position: fixed; top: 0; left: 0; width: 100%; background: rgba(18, 18, 18, 0.9); backdrop-filter: blur(10px); padding: 15px; text-align: center; z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .app-header h1 { font-size: 1.2em; color: var(--gold); text-transform: uppercase; letter-spacing: 2px; }

        .app-container { padding: 15px; width: 100%; max-width: 600px; margin: 0 auto; }
        .view { display: none; flex-direction: column; gap: 15px; }
        .view.active { display: flex; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: var(--gray); padding: 20px; border-radius: 16px; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.05); }
        .form-group { display: flex; flex-direction: column; gap: 10px; }
        input, select, button { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #333; font-size: 16px; background: rgba(0,0,0,0.3); color: white; }
        .btn { background: var(--gold); color: #000; font-weight: bold; border: none; text-transform: uppercase; cursor: pointer; }

        /* Dias da Semana Selector */
        .days-selector { display: flex; justify-content: space-between; gap: 5px; margin: 10px 0; }
        .day-btn { flex: 1; padding: 10px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: #777; font-size: 12px; font-weight: bold; cursor: pointer; text-align: center; transition: 0.2s; }
        .day-btn.active { background: var(--gold); color: black; border-color: var(--gold); }

        .item-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .list-item { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--gold); }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(30, 30, 30, 0.95); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid rgba(255,255,255,0.1); z-index: 1000; }
        .nav-item { color: #777; font-size: 10px; text-align: center; cursor: pointer; }
        .nav-item.active { color: var(--gold); }
        .nav-item span { display: block; font-size: 20px; }
    </style>
</head>
<body>

    <div id="particles-js"></div>
    <header class="app-header"><h1>AppFamilia Pro</h1></header>

    <div class="app-container">
        <div id="viewFinanceiro" class="view">
            <div class="card">
                <h2>Lançamento</h2>
                <div class="form-group">
                    <input type="text" id="finDesc" placeholder="Descrição">
                    <input type="number" id="finValue" placeholder="Valor R$" inputmode="decimal">
                    <button class="btn" onclick="addFinance()">Salvar</button>
                </div>
            </div>
        </div>

        <div id="viewTarefas" class="view active">
            <div class="card">
                <h2>Novo Lembrete 🔔</h2>
                <div class="form-group">
                    <input type="text" id="taskInput" placeholder="O que lembrar?">
                    <input type="time" id="taskTime">
                    
                    <p style="font-size: 12px; color: var(--gold); margin-top: 5px;">Repetir nos dias:</p>
                    <div class="days-selector">
                        <div class="day-btn" data-day="0">D</div>
                        <div class="day-btn" data-day="1">S</div>
                        <div class="day-btn" data-day="2">T</div>
                        <div class="day-btn" data-day="3">Q</div>
                        <div class="day-btn" data-day="4">Q</div>
                        <div class="day-btn" data-day="5">S</div>
                        <div class="day-btn" data-day="6">S</div>
                    </div>

                    <button class="btn" onclick="addTask()">Salvar Lembrete</button>
                    <button class="btn" style="background:#444; color:white; font-size:12px;" onclick="testSound()">🔊 Testar Som de Alerta</button>
                </div>
            </div>
            
            <ul id="taskList" class="item-list" style="margin-top:20px;"></ul>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item" onclick="navTab('viewFinanceiro', this)"><span>➕</span>Financeiro</div>
        <div class="nav-item active" onclick="navTab('viewTarefas', this)"><span>📝</span>Tarefas</div>
    </nav>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGKDP5V75gMI7uO4gpZL6IpV3teP6J4ao",
            authDomain: "appfamilia-5ebe4.firebaseapp.com",
            databaseURL: "https://appfamilia-5ebe4-default-rtdb.firebaseio.com",
            projectId: "appfamilia-5ebe4",
            storageBucket: "appfamilia-5ebe4.firebasestorage.app",
            messagingSenderId: "588166444818",
            appId: "1:588166444818:web:4dcc01e0c6d1608cbc65cb"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // --- SISTEMA DE SOM ---
        const alertSound = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');

        function testSound() {
            alertSound.play().catch(e => alert("Clica na tela primeiro para autorizar o som!"));
        }

        // --- LÓGICA DE DIAS (UI) ---
        const selectedDays = [];
        document.querySelectorAll('.day-btn').forEach(btn => {
            btn.onclick = () => {
                const day = parseInt(btn.dataset.day);
                btn.classList.toggle('active');
                if (selectedDays.includes(day)) {
                    selectedDays.splice(selectedDays.indexOf(day), 1);
                } else {
                    selectedDays.push(day);
                }
            };
        });

        function navTab(viewId, element) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        // --- NOTIFICAÇÃO COM SOM ---
        setInterval(() => {
            const agora = new Date();
            const diaSemana = agora.getDay(); // 0 a 6
            const horaAtual = agora.getHours().toString().padStart(2, '0') + ":" + agora.getMinutes().toString().padStart(2, '0');
            const minutoUnico = hojeUnico();

            db.ref("tarefas").once('value', snap => {
                snap.forEach(child => {
                    const t = child.val();
                    // Verifica: Hora bate? Dia da semana está selecionado? Já tocou neste minuto?
                    if (t.hora === horaAtual && t.dias && t.dias.includes(diaSemana) && t.ultimoToque !== minutoUnico) {
                        
                        alertSound.play(); // Toca o som

                        if (Notification.permission === "granted") {
                            new Notification("Lembrete: " + t.texto);
                        } else {
                            alert("🔔 LEMBRETE: " + t.texto);
                        }
                        
                        // Marca como tocado neste minuto para não repetir 60 vezes
                        db.ref("tarefas").child(child.key).update({ ultimoToque: minutoUnico });
                    }
                });
            });
        }, 30000); // Checa a cada 30 segundos

        function hojeUnico() {
            const d = new Date();
            return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate() + "-" + d.getHours() + "-" + d.getMinutes();
        }

        // --- TAREFAS ---
        async function addTask() {
            const val = document.getElementById('taskInput').value;
            const time = document.getElementById('taskTime').value;
            if (!val || !time || selectedDays.length === 0) return alert("Preencha texto, hora e escolha os dias!");

            await db.ref("tarefas").push({
                texto: val,
                hora: time,
                dias: selectedDays,
                ultimoToque: ""
            });

            document.getElementById('taskInput').value = '';
            alert("Lembrete programado!");
            fetchTasks();
            if (Notification.permission !== "granted") Notification.requestPermission();
        }

        async function fetchTasks() {
            const snap = await db.ref("tarefas").once('value');
            const list = document.getElementById('taskList'); list.innerHTML = '';
            const diasNome = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
            
            snap.forEach(c => {
                const t = c.val();
                const diasTexto = t.dias.map(d => diasNome[d]).join(', ');
                list.innerHTML += `
                <li class="list-item">
                    <div>
                        <b>${t.texto}</b><br>
                        <small>⏰ ${t.hora} (${diasTexto})</small>
                    </div>
                    <span onclick="db.ref('tarefas').child('${c.key}').remove(); fetchTasks();" style="cursor:pointer">✅</span>
                </li>`;
            });
        }

        // --- FUNDO DINÂMICO ---
        particlesJS('particles-js', { "particles": { "number": { "value": 40 }, "color": { "value": "#d4af37" }, "shape": { "type": "circle" }, "opacity": { "value": 0.2 }, "size": { "value": 2 }, "line_linked": { "enable": true, "distance": 150, "color": "#d4af37", "opacity": 0.1 } } });

        window.onload = () => { fetchTasks(); };
    </script>
</body>
</html>
