<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brim Dev - AppFamilia</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-dark: #000000; --card-bg: #1c1c1e; --text-main: #ffffff;
            --text-secondary: #8e8e93; --accent-blue: #0a84ff; --accent-green: #30d158;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; background-color: var(--bg-dark); color: var(--text-main); padding: 20px; padding-bottom: 110px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header h1 { font-size: 24px; font-weight: 600; text-transform: capitalize; }

        /* WIDGET PRINCIPAL */
        .main-widget { background: radial-gradient(circle at center, #1c1c1e 0%, #000 100%); border-radius: 35px; padding: 40px 20px; text-align: center; margin-bottom: 25px; border: 1px solid #2c2c2e; }
        .ring-container { width: 220px; height: 220px; margin: 0 auto; position: relative; }
        .balance-info { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; }
        .balance-info h2 { font-size: 24px; font-weight: 700; }
        .balance-info p { font-size: 12px; color: var(--text-secondary); margin-top: 5px; }

        .stats-row { display: flex; justify-content: space-around; margin-top: 30px; border-top: 1px solid #2c2c2e; padding-top: 20px; }
        .stat-item p { font-size: 11px; color: var(--text-secondary); margin-bottom: 5px; }
        .stat-item span { font-weight: 600; font-size: 13px; }

        /* LISTA DE TRANSAÇÕES */
        .section-title { font-size: 18px; font-weight: 600; margin-bottom: 15px; }
        .transaction-list { display: flex; flex-direction: column; gap: 12px; }
        .transaction-item { background: #1c1c1e; padding: 18px; border-radius: 24px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2c2c2e; }
        .tx-left { display: flex; align-items: center; gap: 15px; }
        .icon-circle { width: 45px; height: 45px; background: #2c2c2e; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .tx-details b { font-size: 16px; display: block; }
        .tx-details span { font-size: 12px; color: var(--text-secondary); }
        .tx-right { text-align: right; }
        .tx-actions { display: flex; gap: 15px; font-size: 18px; margin-top: 8px; justify-content: flex-end; }
        .action-btn { cursor: pointer; opacity: 0.6; }

        /* MENU INFERIOR */
        .nav-bar { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); width: 92%; background: rgba(28, 28, 30, 0.9); backdrop-filter: blur(20px); border-radius: 30px; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.1); z-index: 1000; }
        .nav-btn { color: var(--text-secondary); font-size: 24px; cursor: pointer; }
        .nav-btn.active { color: var(--text-main); }
        .add-btn { background: white; color: black; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; margin-top: -50px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }

        /* MODAL */
        #modalLancamento { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; padding: 40px 20px; }
        .modal-content { background: #1c1c1e; border-radius: 30px; padding: 30px; border: 1px solid #333; }
        input, select { width: 100%; padding: 16px; border-radius: 14px; border: none; background: #2c2c2e; color: white; margin-bottom: 15px; font-size: 16px; outline: none; }
        .btn-save { background: var(--accent-blue); color: white; padding: 18px; border-radius: 16px; border: none; width: 100%; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="txtData">Maio 2026</h1>
        <div style="font-size: 20px;">⚙️</div>
    </div>

    <div class="main-widget">
        <div class="ring-container">
            <canvas id="balanceRing"></canvas>
            <div class="balance-info">
                <h2 id="totalSaldo">R$ 0</h2>
                <p>restante no mês</p>
            </div>
        </div>
        <div class="stats-row">
            <div class="stat-item"><p>Orçamento ></p><span id="budgetVal">R$ 5.000</span></div>
            <div class="stat-item"><p>Gasto ></p><span id="allocatedVal">R$ 0</span></div>
            <div class="stat-item"><p>Disponível ></p><span id="availableVal">R$ 0</span></div>
        </div>
    </div>
    
    <div class="section-title">Transações do Mês</div>
    <div class="transaction-list" id="recentList"></div>

    <nav class="nav-bar">
        <div class="nav-btn active">🏠</div>
        <div class="nav-btn">📊</div>
        <div class="add-btn" onclick="openModal()">+</div>
        <div class="nav-btn">🎯</div>
        <div class="nav-btn">👤</div>
    </nav>

    <div id="modalLancamento">
        <div class="modal-content">
            <h2 id="modalTitle" style="margin-bottom: 20px;">Novo Registro</h2>
            <input type="hidden" id="editKey">
            <select id="finType"><option value="gasto">🔴 Saída</option><option value="ganho">🟢 Entrada</option></select>
            <input type="text" id="finDesc" placeholder="Descrição"><input type="number" id="finValue" placeholder="Valor R$" inputmode="decimal">
            <button class="btn-save" id="btnSave" onclick="saveFinance()">Salvar Registro</button>
            <button onclick="closeModal()" style="background:none;border:none;color:var(--text-secondary);width:100%;margin-top:20px;">Cancelar</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGKDP5V75gMI7uO4gpZL6IpV3teP6J4ao",
            authDomain: "appfamilia-5ebe4.firebaseapp.com",
            databaseURL: "https://appfamilia-5ebe4-default-rtdb.firebaseio.com",
            projectId: "appfamilia-5ebe4",
            storageBucket: "appfamilia-5ebe4.firebasestorage.app",
            messagingSenderId: "588166444818",
            appId: "1:588166444818:web:4dcc01e0c6d1608cbc65cb"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let ringChart;

        // INICIALIZAÇÃO E LISTENER REAL-TIME
        window.onload = () => {
            // "on" garante que qualquer mudança no banco atualize o gráfico na hora
            db.ref("financas").on('value', (snap) => {
                updateDashboard(snap);
            });
        };

        function updateDashboard(snap) {
            const currentMonth = new Date().toISOString().substring(0, 7);
            let gan = 0, gas = 0;
            const list = document.getElementById('recentList');
            list.innerHTML = '';

            snap.forEach(c => {
                const f = c.val();
                if (f.mes === currentMonth || !f.mes) {
                    if (f.tipo === 'ganho') gan += f.valor; else gas += f.valor;
                    
                    list.innerHTML = `
                    <div class="transaction-item">
                        <div class="tx-left">
                            <div class="icon-circle">${f.tipo==='ganho'?'💰':'🛒'}</div>
                            <div class="tx-details"><b>${f.descricao}</b><span>${new Date(f.data).toLocaleDateString()}</span></div>
                        </div>
                        <div class="tx-right">
                            <b style="color:${f.tipo==='ganho'?'#30d158':'#fff'}">R$ ${f.valor.toFixed(2)}</b>
                            <div class="tx-actions">
                                <span class="action-btn" onclick="editFin('${c.key}')">✏️</span>
                                <span class="action-btn" onclick="deleteFin('${c.key}')">🗑️</span>
                            </div>
                        </div>
                    </div>` + list.innerHTML;
                }
            });

            const orcamento = 5000;
            const saldoFinal = orcamento - gas;
            
            document.getElementById('totalSaldo').innerText = `R$ ${saldoFinal.toFixed(2)}`;
            document.getElementById('allocatedVal').innerText = `R$ ${gas.toFixed(2)}`;
            document.getElementById('availableVal').innerText = `R$ ${saldoFinal.toFixed(2)}`;
            
            renderRing(gas, orcamento);
        }

        function renderRing(gas, total) {
            const canvas = document.getElementById('balanceRing');
            const ctx = canvas.getContext('2d');
            
            if(ringChart) ringChart.destroy();
            
            ringChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [gas, Math.max(0, total - gas)],
                        backgroundColor: ['#0a84ff', '#1c1c1e'],
                        borderWidth: 0,
                        borderRadius: 20
                    }]
                },
                options: { cutout: '85%', responsive: true, maintainAspectRatio: true, plugins: { legend: { display: false } } }
            });
        }

        // CRUD FUNCTIONS
        function openModal(editData = null) {
            if(editData) {
                document.getElementById('modalTitle').innerText = "Editar";
                document.getElementById('editKey').value = editData.key;
                document.getElementById('finType').value = editData.tipo;
                document.getElementById('finDesc').value = editData.descricao;
                document.getElementById('finValue').value = editData.valor;
            } else {
                document.getElementById('modalTitle').innerText = "Novo";
                document.getElementById('editKey').value = "";
                document.getElementById('finDesc').value = "";
                document.getElementById('finValue').value = "";
            }
            document.getElementById('modalLancamento').style.display = 'block';
        }

        function closeModal() { document.getElementById('modalLancamento').style.display = 'none'; }

        async function saveFinance() {
            const key = document.getElementById('editKey').value;
            const type = document.getElementById('finType').value;
            const desc = document.getElementById('finDesc').value;
            const val = parseFloat(document.getElementById('finValue').value) || 0;

            if(!desc || val <= 0) return alert("Dados inválidos");

            const data = {
                tipo: type, descricao: desc, valor: val,
                data: firebase.database.ServerValue.TIMESTAMP,
                mes: new Date().toISOString().substring(0, 7)
            };

            if(key) await db.ref("financas").child(key).update(data);
            else await db.ref("financas").push(data);
            
            closeModal();
        }

        async function deleteFin(key) {
            if(confirm("Excluir?")) await db.ref("financas").child(key).remove();
        }

        async function editFin(key) {
            const snap = await db.ref("financas").child(key).once('value');
            openModal({key, ...snap.val()});
        }
    </script>
</body>
</html>
