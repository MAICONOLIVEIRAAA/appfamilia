<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BrimChat Pro v2.0</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

    <style>
        :root {
            --bg-dark: #0b141a; --bg-panel: #111b21; --accent: #00a884;
            --bubble-me: #005c4b; --bubble-other: #202c33; --text: #e9edef;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg-dark); color: var(--text); height: 100vh; display: flex; overflow: hidden; }

        /* SIDEBAR DE CONTATOS */
        .sidebar {
            width: 30%; min-width: 80px; background: var(--bg-panel);
            border-right: 1px solid #222; display: flex; flex-direction: column;
        }
        .contact-item {
            padding: 15px; border-bottom: 1px solid #222; cursor: pointer;
            display: flex; align-items: center; gap: 10px; transition: 0.2s;
        }
        .contact-item:hover { background: #202c33; }
        .contact-item.active { background: #2a3942; }

        /* ÁREA PRINCIPAL CHAT */
        .main-chat { flex: 1; display: flex; flex-direction: column; position: relative; }
        
        .chat-header {
            background: var(--bg-panel); padding: 10px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }

        #chatWindow {
            flex: 1; overflow-y: auto; padding: 20px; display: flex;
            flex-direction: column; gap: 8px; background-color: #0b141a;
        }

        /* MENSAGENS E MÍDIA */
        .msg { max-width: 65%; padding: 8px 12px; border-radius: 10px; position: relative; font-size: 14px; }
        .msg.me { align-self: flex-end; background: var(--bubble-me); }
        .msg.other { align-self: flex-start; background: var(--bubble-other); }
        .msg img { max-width: 100%; border-radius: 8px; margin-top: 5px; cursor: pointer; }

        /* INPUT AREA */
        .input-area {
            background: var(--bg-panel); padding: 10px; display: flex; align-items: center; gap: 10px;
        }
        #msgInput { flex: 1; background: #2a3942; border: none; padding: 12px; border-radius: 20px; color: white; outline: none; }
        
        .btn-icon { background: none; border: none; cursor: pointer; color: var(--text); font-size: 20px; }
        #typing { font-size: 11px; color: var(--accent); position: absolute; bottom: 65px; left: 20px; display: none; }

        /* LOGIN */
        #loginOverlay {
            position: fixed; inset: 0; background: var(--bg-dark); z-index: 1000;
            display: flex; align-items: center; justify-content: center;
        }

        @media (max-width: 600px) { .sidebar { width: 80px; } .contact-name { display: none; } }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div style="background: var(--bg-panel); padding: 40px; border-radius: 20px; text-align: center;">
            <h2 style="color:var(--accent); margin-bottom: 20px;">BrimChat Pro</h2>
            <input type="text" id="userName" placeholder="Nome do usuário..." 
                   style="padding: 10px; width: 250px; border-radius: 5px; border: none; margin-bottom: 20px;">
            <br>
            <button onclick="login()" style="background: var(--accent); border: none; padding: 10px 40px; border-radius: 5px; font-weight: bold; cursor: pointer;">ENTRAR</button>
        </div>
    </div>

    <aside class="sidebar">
        <div class="contact-item active">
            <div style="width: 40px; height: 40px; background: #6a7175; border-radius: 50%; display: grid; place-items: center;">G</div>
            <span class="contact-name">Grupo Geral</span>
        </div>
        </aside>

    <main class="main-chat">
        <header class="chat-header">
            <div>
                <b id="headerName">Grupo Geral</b><br>
                <small id="statusHeader" style="color: var(--accent);">online</small>
            </div>
            <div style="opacity: 0.6;">🔍 ⋮</div>
        </header>

        <div id="chatWindow"></div>
        
        <div id="typing">Alguém está digitando...</div>

        <div class="input-area">
            <label class="btn-icon">
                📎 <input type="file" id="fileInput" style="display: none;" onchange="uploadFile(this)">
            </label>
            <input type="text" id="msgInput" placeholder="Mensagem" 
                   oninput="notifyTyping()" onkeypress="if(event.key==='Enter') sendMsg()">
            <button class="btn-icon" onclick="sendMsg()" style="color: var(--accent);">➤</button>
        </div>
    </main>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGKDP5V75gMI7uO4gpZL6IpV3teP6J4ao",
            authDomain: "appfamilia-5ebe4.firebaseapp.com",
            databaseURL: "https://appfamilia-5ebe4-default-rtdb.firebaseio.com",
            projectId: "appfamilia-5ebe4",
            storageBucket: "appfamilia-5ebe4.firebasestorage.app",
            messagingSenderId: "588166444818",
            appId: "1:588166444818:web:4dcc01e0c6d1608cbc65cb"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const storage = firebase.storage();

        let currentUser = "";
        let typingTimeout;

        function login() {
            const name = document.getElementById('userName').value.trim();
            if(!name) return;
            currentUser = name;
            document.getElementById('loginOverlay').style.display = 'none';
            initChat();
        }

        // --- ENVIAR TEXTO ---
        function sendMsg() {
            const input = document.getElementById('msgInput');
            if(!input.value.trim()) return;

            db.ref("mensagens").push({
                user: currentUser,
                text: input.value,
                type: 'text',
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
            input.value = "";
            db.ref("status/typing").child(currentUser).remove();
        }

        // --- ENVIAR MÍDIA (FOTO) ---
        async function uploadFile(input) {
            const file = input.files[0];
            if(!file) return;

            const ref = storage.ref(`chats/${Date.now()}_${file.name}`);
            const uploadTask = await ref.put(file);
            const url = await uploadTask.ref.getDownloadURL();

            db.ref("mensagens").push({
                user: currentUser,
                fileUrl: url,
                type: 'image',
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
        }

        // --- STATUS DIGITANDO ---
        function notifyTyping() {
            db.ref("status/typing").child(currentUser).set(true);
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                db.ref("status/typing").child(currentUser).remove();
            }, 2000);
        }

        function initChat() {
            const chat = document.getElementById('chatWindow');
            const typingDiv = document.getElementById('typing');

            // Ouvir Mensagens
            db.ref("mensagens").orderByChild("timestamp").on('value', snap => {
                chat.innerHTML = "";
                snap.forEach(child => {
                    const m = child.val();
                    const isMe = m.user === currentUser;
                    
                    let content = m.type === 'text' ? m.text : `<img src="${m.fileUrl}" onclick="window.open('${m.fileUrl}')">`;

                    chat.innerHTML += `
                        <div class="msg ${isMe ? 'me' : 'other'}">
                            <b style="font-size:10px; color:var(--accent);">${isMe ? '' : m.user}</b><br>
                            ${content}
                            <div style="font-size:9px; text-align:right; opacity:0.5; margin-top:4px;">${m.time}</div>
                        </div>
                    `;
                });
                chat.scrollTop = chat.scrollHeight;
            });

            // Ouvir quem está digitando
            db.ref("status/typing").on('value', snap => {
                const typers = snap.val() ? Object.keys(snap.val()).filter(u => u !== currentUser) : [];
                typingDiv.style.display = typers.length > 0 ? 'block' : 'none';
                typingDiv.innerText = typers.length === 1 ? `${typers[0]} está digitando...` : 'Várias pessoas digitando...';
            });
        }
    </script>
</body>
</html>
