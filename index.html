<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeuPad - Compartilhamento</title>
    <style>
        body, html { 
            margin: 0; padding: 0; font-family: sans-serif; 
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); 
            color: #333;
            height: 100vh;
            overflow: hidden; 
        }
        
        /* Barra Superior - Estilo Liquid Glass */
        .topbar {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
            border-radius: 50px;
            height: 60px; 
            padding: 0 30px;
            margin: 20px;
        }

        .logo { font-size: 20px; font-weight: bold; }
        .menu { display: flex; gap: 15px; align-items: center; }
        
        .btn-login {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.6);
            color: #333;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-login:hover { background: rgba(255, 255, 255, 0.8); }

        .btn-pro {
            background: #ffaa00;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 170, 0, 0.3);
            transition: all 0.2s ease;
        }
        .btn-pro:hover { background: #e69900; transform: translateY(-2px); }

        /* Área do Texto com leve efeito Glass */
        .pad-area { 
            height: calc(100vh - 120px); 
            padding: 0 20px 20px 20px;
            box-sizing: border-box;
        }
        textarea { 
            width: 100%; 
            height: 100%; 
            background: rgba(255, 255, 255, 0.7); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6); 
            border-radius: 16px;
            padding: 25px;
            resize: none; 
            font-size: 18px; 
            outline: none;
            box-sizing: border-box;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: border-color 0.3s;
        }
        textarea:focus { border-color: rgba(255, 170, 0, 0.5); }

        /* Estilo Geral dos Modais */
        .modal-overlay {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.6);
        }
        .close-btn {
            float: right; font-size: 20px; font-weight: bold; cursor: pointer; color: #888;
        }
        
        /* Elementos do Modal PRO */
        .pricing-cards {
            display: flex; gap: 15px; margin-top: 20px; justify-content: center;
        }
        .card {
            border: 1px solid #eee; padding: 20px; border-radius: 12px; width: 30%;
            background: #fdfdfd; transition: transform 0.2s;
        }
        .card.destaque {
            border: 2px solid #ffaa00;
            background: #fffdf5;
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255,170,0,0.15);
        }
        .card h3 { margin: 0 0 10px 0; color: #333; }
        .price { font-size: 24px; font-weight: bold; color: #28a745; margin-bottom: 5px; }
        .details { font-size: 12px; color: #666; margin-bottom: 15px; }
        
        /* Botões Genéricos de Ação */
        .btn-acao {
            background: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 30px; cursor: pointer; font-size: 16px; font-weight: bold;
            transition: background 0.2s;
        }
        .btn-acao:hover { background: #218838; }
        
        /* Formulários de Auth */
        .form-group {
            margin-bottom: 15px; text-align: left;
        }
        .form-group label {
            display: block; margin-bottom: 5px; color: #333; font-weight: bold;
        }
        .form-group input {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; outline: none;
        }
        .form-group input:focus { border-color: #28a745; }
    </style>
</head>
<body>

    <!-- Barra Superior -->
    <div class="topbar">
        <div class="logo">MeuPad</div>
        <div class="menu">
            <button class="btn-login" onclick="abrirModalLogin()">Login</button>
            <button class="btn-pro" onclick="abrirModalPro()">Seja PRO</button>
        </div>
    </div>

    <!-- Área de Texto -->
    <div class="pad-area">
        <textarea id="texto-pad" placeholder="Carregando texto..."></textarea>
    </div>

    <!-- Janela de Planos PRO -->
    <div class="modal-overlay" id="modalPro">
        <div class="modal-content" style="max-width: 600px;">
            <span class="close-btn" onclick="fecharModalPro()">&times;</span>
            <h2>Faça o upgrade para o PRO</h2>
            <p>Faça upload de arquivos de até 500 MB e proteja seus links com senha.</p>
            
            <div class="pricing-cards">
                <div class="card">
                    <h3>Mensal</h3>
                    <div class="price">R$ 9,99</div>
                    <div class="details">Cobrado mensalmente</div>
                    <button class="btn-acao">Assinar</button>
                </div>
                <div class="card destaque">
                    <h3>12 Meses</h3>
                    <div class="price">R$ 4,99<span style="font-size:14px">/mês</span></div>
                    <div class="details">Pagamento único de R$ 59,88</div>
                    <button class="btn-acao">Assinar</button>
                </div>
                <div class="card">
                    <h3>6 Meses</h3>
                    <div class="price">R$ 6,99<span style="font-size:14px">/mês</span></div>
                    <div class="details">Pagamento único de R$ 41,94</div>
                    <button class="btn-acao">Assinar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Janela de Login / Cadastro -->
    <div class="modal-overlay" id="modalLogin">
        <div class="modal-content" style="max-width: 400px;">
            <span class="close-btn" onclick="fecharModalLogin()">&times;</span>
            
            <h2 id="titulo-auth">Acesse sua conta</h2>
            
            <form id="form-auth" onsubmit="fazerLogin(event)">
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="email" required placeholder="seu@email.com">
                </div>
                
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="senha" required placeholder="Sua senha">
                </div>
                
                <button type="submit" class="btn-acao" id="btn-submit-auth">Entrar</button>
            </form>

            <p style="margin-top: 20px; font-size: 14px; color: #666;">
                <span id="texto-alternar">Não tem uma conta?</span> 
                <a href="#" onclick="alternarModoAuth()" style="color: #28a745; text-decoration: none; font-weight: bold;" id="link-alternar">Cadastre-se</a>
            </p>
        </div>
    </div>

    <!-- Importa o Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Scripts de Controle e Lógica -->
    <script>
        /* ==========================================
           CONFIGURAÇÃO DO SUPABASE
           ========================================== */
        const supabaseUrl = 'https://fcrgbdkiqnqtgmzevarh.supabase.co';
        const supabaseKey = 'sb_publishable_epnSTe_H_mCleZdgyl_AYw_8xGgRueS';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        /* ==========================================
           LÓGICA DOS MODAIS (LOGIN E PRO)
           ========================================== */
        function abrirModalPro() { document.getElementById('modalPro').style.display = 'flex'; }
        function fecharModalPro() { document.getElementById('modalPro').style.display = 'none'; }

        let modoLogin = true;

        function abrirModalLogin() { document.getElementById('modalLogin').style.display = 'flex'; }
        function fecharModalLogin() {
            document.getElementById('modalLogin').style.display = 'none';
            if (!modoLogin) alternarModoAuth();
        }

        function alternarModoAuth() {
            modoLogin = !modoLogin;
            const titulo = document.getElementById('titulo-auth');
            const btnSubmit = document.getElementById('btn-submit-auth');
            const textoAlternar = document.getElementById('texto-alternar');
            const linkAlternar = document.getElementById('link-alternar');

            if (modoLogin) {
                titulo.innerText = 'Acesse sua conta';
                btnSubmit.innerText = 'Entrar';
                textoAlternar.innerText = 'Não tem uma conta?';
                linkAlternar.innerText = 'Cadastre-se';
            } else {
                titulo.innerText = 'Crie sua conta PRO';
                btnSubmit.innerText = 'Cadastrar';
                textoAlternar.innerText = 'Já tem uma conta?';
                linkAlternar.innerText = 'Faça Login';
            }
        }

        async function fazerLogin(event) {
            event.preventDefault(); 
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const btnSubmit = document.getElementById('btn-submit-auth');
            
            const textoOriginal = btnSubmit.innerText;
            btnSubmit.innerText = 'Aguarde...';
            btnSubmit.disabled = true;

            if (modoLogin) {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password: senha });
                if (error) {
                    alert("Erro ao entrar: " + error.message);
                } else {
                    alert("Sucesso! Redirecionando para o painel administrativo...");
                    window.location.href = 'configuracoes.html';
                }
            } else {
                const { data, error } = await supabase.auth.signUp({ email, password: senha });
                if (error) {
                    alert("Erro ao cadastrar: " + error.message);
                } else {
                    alert("Cadastro realizado com sucesso! Agora você pode fazer login.");
                    alternarModoAuth(); 
                }
            }
            btnSubmit.innerText = textoOriginal;
            btnSubmit.disabled = false;
        }

        /* ==========================================
           LÓGICA DO BLOCO DE NOTAS (AUTO-SAVE)
           ========================================== */
        const textarea = document.getElementById('texto-pad');
        let padSlug = window.location.hash.substring(1) || 'padrao'; 
        let timeoutDigitacao;

        // 1. Carregar o texto do banco de dados ao abrir a página
        async function carregarPad() {
            textarea.placeholder = "Carregando texto...";
            
            const { data, error } = await supabase
                .from('pads')
                .select('text_content')
                .eq('slug', padSlug)
                .single(); 

            if (data) {
                textarea.value = data.text_content;
            } else {
                textarea.value = ''; 
            }
            textarea.placeholder = "Comece a digitar aqui...";
        }

        // 2. Salvar o texto no banco de dados
        async function salvarPad() {
            const texto = textarea.value;
            const { error } = await supabase
                .from('pads')
                .upsert(
                    { slug: padSlug, text_content: texto }, 
                    { onConflict: 'slug' }
                );

            if (error) {
                console.error("Erro ao salvar:", error);
            } else {
                console.log("Texto salvo na nuvem com sucesso!");
            }
        }

        // 3. Monitorar a digitação (Salva automaticamente após 1 segundo)
        textarea.addEventListener('input', () => {
            clearTimeout(timeoutDigitacao);
            timeoutDigitacao = setTimeout(salvarPad, 1000);
        });

        // 4. Detectar mudança na URL (se o usuário alterar o #nome lá em cima)
        window.addEventListener('hashchange', () => {
            padSlug = window.location.hash.substring(1) || 'padrao';
            carregarPad();
        });

        // Inicia carregando o texto da URL atual
        carregarPad();
    </script>

</body>
</html>
