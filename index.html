<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BrimBot - IA Direta (Corrigido)</title>
    <style>
        :root {
            --bg-main: #000000;
            --bg-card: #1c1c1e;
            --text-main: #ffffff;
            --text-dim: #8e8e93;
            --accent: #0a84ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        
        body { 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }

        .header { padding: 20px; text-align: center; border-bottom: 1px solid #333; background: var(--bg-card); }
        .header h1 { font-size: 18px; letter-spacing: 1px; }
        .header span { font-size: 12px; color: var(--accent); font-weight: bold; }

        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }

        .bubble { max-width: 85%; padding: 15px; border-radius: 18px; font-size: 15px; line-height: 1.5; word-wrap: break-word; }
        .user-bubble { align-self: flex-end; background-color: var(--accent); border-bottom-right-radius: 4px; }
        .ai-bubble { align-self: flex-start; background-color: var(--bg-card); border-bottom-left-radius: 4px; border: 1px solid #333; }

        pre { background: #000; padding: 12px; border-radius: 8px; overflow-x: auto; margin-top: 10px; border: 1px solid #333; }
        code { font-family: monospace; color: var(--accent); font-size: 13px; }

        .input-box { padding: 15px; background: var(--bg-card); display: flex; gap: 10px; padding-bottom: calc(15px + env(safe-area-inset-bottom)); }
        input { flex: 1; background: #2c2c2e; border: none; padding: 15px 20px; border-radius: 25px; color: white; font-size: 15px; outline: none; }
        button { background: var(--accent); color: white; border: none; width: 50px; height: 50px; border-radius: 50%; font-size: 20px; cursor: pointer; display: grid; place-items: center; }
        button:disabled { background: #333; cursor: not-allowed; }

        .loading { font-size: 12px; color: var(--text-dim); align-self: flex-start; display: none; margin-left: 10px; font-style: italic; }
    </style>
</head>
<body>

    <div class="header">
        <h1>BrimBot</h1>
        <span>🟢 Motor: Gemini Pro</span>
    </div>

    <div id="chat-container">
        <div class="bubble ai-bubble">
            Sistemas reiniciados e motor ajustado. Pode mandar o seu prompt, Pablo!
        </div>
    </div>
    
    <div id="loadingIndicator" class="loading">Pensando...</div>

    <div class="input-box">
        <input type="text" id="userInput" placeholder="Faça sua pergunta aqui..." onkeypress="if(event.key==='Enter') sendPrompt()">
        <button id="sendBtn" onclick="sendPrompt()">➤</button>
    </div>

    <script>
        // CHAVE DE API ISOLADA
        const API_KEY = "AIzaSyBIBCta_wFjw1dPMs-ZZSGB4D0JA4k2PzM"; 
        
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const loadingIndicator = document.getElementById('loadingIndicator');

        async function sendPrompt() {
            const text = userInput.value.trim();
            if (!text) return;

            userInput.value = '';
            appendMessage(text, 'user-bubble');

            sendBtn.disabled = true;
            loadingIndicator.style.display = 'block';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                // AQUI FOI ONDE EU CORRIGI: Troquei gemini-1.5-flash por gemini-pro
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${API_KEY}`;
                
                const resposta = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });

                if (!resposta.ok) {
                    const erro = await resposta.json();
                    throw new Error(erro.error?.message || "Erro desconhecido na API");
                }

                const dados = await resposta.json();
                const textoIA = dados.candidates[0].content.parts[0].text;
                
                appendMessage(textoIA, 'ai-bubble');

            } catch (error) {
                console.error(error);
                appendMessage(`❌ **Erro da API:** ${error.message}`, 'ai-bubble');
            } finally {
                sendBtn.disabled = false;
                loadingIndicator.style.display = 'none';
                userInput.focus();
            }
        }

        function appendMessage(text, className) {
            const div = document.createElement('div');
            div.className = `bubble ${className}`;
            
            let htmlText = text
                .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
                .replace(/\n/g, '<br>');

            div.innerHTML = htmlText;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
