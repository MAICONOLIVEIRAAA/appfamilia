<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brim Dev - AppFamilia</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-dark: #000000;
            --card-bg: #1c1c1e;
            --text-main: #ffffff;
            --text-secondary: #8e8e93;
            --accent-blue: #0a84ff;
            --accent-green: #30d158;
            --accent-pink: #ff375f;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            padding: 20px;
            padding-bottom: 110px;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header h1 { font-size: 24px; font-weight: 600; text-transform: capitalize; }

        /* WIDGETS */
        .main-widget {
            background: radial-gradient(circle at center, #1c1c1e 0%, #000 100%);
            border-radius: 35px;
            padding: 40px 20px;
            text-align: center;
            margin-bottom: 25px;
            border: 1px solid #2c2c2e;
        }
        .ring-container { width: 220px; height: 220px; margin: 0 auto; position: relative; }
        .balance-info { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .balance-info h2 { font-size: 26px; font-weight: 700; }

        .stats-row { display: flex; justify-content: space-around; margin-top: 30px; border-top: 1px solid #2c2c2e; padding-top: 20px; }
        .stat-item p { font-size: 11px; color: var(--text-secondary); margin-bottom: 5px; }
        .stat-item span { font-weight: 600; font-size: 13px; }

        .insights-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .insight-card { background: var(--card-bg); border-radius: 24px; padding: 20px; height: 160px; display: flex; flex-direction: column; justify-content: space-between; }
        .insight-card h3 { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; }

        .section-title { font-size: 18px; font-weight: 600; margin-bottom: 15px; }

        .transaction-list { display: flex; flex-direction: column; gap: 12px; }
        .transaction-item { background: #1c1c1e; padding: 15px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; }

        /* MENU INFERIOR FUNCIONAL */
        .nav-bar {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%);
            width: 92%; background: rgba(28, 28, 30, 0.9); backdrop-filter: blur(20px);
            border-radius: 30px; padding: 15px 20px; display: flex; justify-content: space-between;
            align-items: center; border: 1px solid rgba(255,255,255,0.1); z-index: 1000;
        }
        .nav-btn { color: var(--text-secondary); font-size: 24px; cursor: pointer; transition: 0.3s; padding: 10px; }
        .nav-btn.active { color: var(--text-main); transform: scale(1.1); }
        .add-btn { background: white; color: black; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; margin-top: -50px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }

        /* MODAL */
        #modalLancamento { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; padding: 40px 20px; }
        .modal-content { background: #1c1c1e; border-radius: 30px; padding: 30px; }
        input, select { width: 100%; padding: 16px; border-radius: 14px; border: none; background: #2c2c2e; color: white; margin-bottom: 15px; font-size: 16px; outline: none; }
        .btn-save { background: var(--accent-blue); color: white; padding: 18px; border-radius: 16px; border: none; width: 100%; font-weight: bold; }

        /* VIEW SYSTEM */
        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="txtData">Maio 2026</h1>
        <div style="font-size: 20px;">⚙️</div>
    </div>

    <div id="viewHome" class="view active">
        <div class="main-widget">
            <div class="ring-container">
                <canvas id="balanceRing"></canvas>
                <div class="balance-info">
                    <h2 id="totalSaldo">R$ 0</h2>
                    <p>restante</p>
                </div>
            </div>
            <div class="stats-row">
                <div class="stat-item"><p>Orçamento ></p><span id="budgetVal">R$ 5.000</span></div>
                <div class="stat-item"><p>Gasto ></p><span id="allocatedVal">R$ 0</span></div>
                <div class="stat-item"><p>Disponível ></p><span id="availableVal">R$ 0</span></div>
            </div>
        </div>
        <div class="insights-grid">
            <div class="insight-card"><h3>Tendência</h3><div style="font-size:20px;font-weight:700;margin-top:10px;">+99% 📈</div><small style="color:var(--accent-green)">Aumentando</small></div>
            <div class="insight-card"><h3>Poupança</h3><div style="font-size:20px;font-weight:700;margin-top:10px;">20%</div><div style="width:100%;height:4px;background:#333;margin-top:10px;"><div style="width:20%;height:100%;background:var(--accent-blue);"></div></div></div>
        </div>
    </div>

    <div id="viewHistorico" class="view">
        <div class="section-title">Transações Recentes</div>
        <div class="transaction-list" id="recentList"></div>
    </div>

    <nav class="nav-bar">
        <div class="nav-btn active" onclick="navTab('viewHome', this)">🏠</div>
        <div class="nav-btn" onclick="navTab('viewHistorico', this)">📊</div>
        <div class="add-btn" onclick="openModal()">+</div>
        <div class="nav-btn" onclick="navTab('viewHome', this)">🎯</div>
        <div class="nav-btn" onclick="navTab('viewHome', this)">👤</div>
    </nav>

    <div id="modalLancamento">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px;">Novo Registro</h2>
            <select id="finType"><option value="gasto">🔴 Saída</option><option value="ganho">🟢 Entrada</option></select>
            <input type="text" id="finDesc" placeholder="Descrição"><input type="number" id="finValue" placeholder="Valor R$" inputmode="decimal">
            <button class="btn-save" onclick="addFinance()">Salvar</button>
            <button onclick="closeModal()" style="background:none;border:none;color:var(--text-secondary);width:100%;margin-top:20px;">Cancelar</button>
        </div>
    </div>

    <script>
        // CONFIG FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyBGKDP5V75gMI7uO4gpZL6IpV3teP6J4ao",
            authDomain: "appfamilia-5ebe4.firebaseapp.com",
            databaseURL: "https://appfamilia-5ebe4-default-rtdb.firebaseio.com",
            projectId: "appfamilia-5ebe4",
            storageBucket: "appfamilia-5ebe4.firebasestorage.app",
            messagingSenderId: "588166444818",
            appId: "1:588166444818:web:4dcc01e0c6d1608cbc65cb"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // NAVEGAÇÃO ENTRE ABAS
        function navTab(viewId, element) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(viewId).classList.add('active');
            element.classList.add('active');
            
            if(viewId === 'viewHome' || viewId === 'viewHistorico') fetchData();
        }

        function openModal() { document.getElementById('modalLancamento').style.display = 'block'; }
        function closeModal() { document.getElementById('modalLancamento').style.display = 'none'; }

        async function addFinance() {
            const type = document.getElementById('finType').value;
            const desc = document.getElementById('finDesc').value;
            const val = parseFloat(document.getElementById('finValue').value) || 0;
            if(!desc || val <= 0) return alert("Preencha corretamente!");

            await db.ref("financas").push({
                tipo: type, descricao: desc, valor: val,
                data: firebase.database.ServerValue.TIMESTAMP,
                mes: new Date().toISOString().substring(0, 7)
            });
            closeModal();
            fetchData();
        }

        let ringChart;
        function renderRing(allocated, budget) {
            const ctx = document.getElementById('balanceRing').getContext('2d');
            if(ringChart) ringChart.destroy();
            ringChart = new Chart(ctx, {
                type: 'doughnut',
                data: { datasets: [{ data: [allocated, Math.max(0, budget - allocated)], backgroundColor: ['#0a84ff', '#1c1c1e'], borderWidth: 0, borderRadius: 20 }] },
                options: { cutout: '85%', responsive: true, plugins: { legend: { display: false } } }
            });
        }

        async function fetchData() {
            const snap = await db.ref("financas").orderByChild("data").once('value');
            let gan = 0, gas = 0;
            const list = document.getElementById('recentList');
            if(list) list.innerHTML = '';

            snap.forEach(c => {
                const f = c.val();
                if(f.tipo === 'ganho') gan += f.valor; else gas += f.valor;
                if(list) {
                    list.innerHTML = `<div class="transaction-item"><div><b>${f.descricao}</b><br><small>${new Date(f.data).toLocaleDateString()}</small></div><b style="color:${f.tipo==='ganho'?'#30d158':'#fff'}">${f.tipo==='ganho'?'+':'-'} R$ ${f.valor}</b></div>` + list.innerHTML;
                }
            });

            const orcamentoTotal = 5000;
            document.getElementById('totalSaldo').innerText = `R$ ${orcamentoTotal - gas}`;
            document.getElementById('allocatedVal').innerText = `R$ ${gas}`;
            document.getElementById('availableVal').innerText = `R$ ${orcamentoTotal - gas}`;
            renderRing(gas, orcamentoTotal);
        }

        window.onload = fetchData;
    </script>
</body>
</html>
