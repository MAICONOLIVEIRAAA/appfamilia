<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brim Dev - AppFamilia Pro v4.3</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-dark: #000000; --card-bg: #1c1c1e; --text-main: #ffffff;
            --text-secondary: #8e8e93; --accent-blue: #0a84ff; --accent-green: #30d158;
            --accent-purple: #af52de;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, system-ui, sans-serif; background-color: var(--bg-dark); color: var(--text-main); padding: 20px; padding-bottom: 120px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .header h1 { font-size: 24px; font-weight: 600; }

        /* DASHBOARD */
        .main-widget { background: radial-gradient(circle at center, #1c1c1e 0%, #000 100%); border-radius: 35px; padding: 30px 20px; text-align: center; margin-bottom: 20px; border: 1px solid #2c2c2e; }
        .ring-container { width: 220px; height: 220px; margin: 0 auto; position: relative; }
        .balance-info { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; pointer-events: none; }
        .balance-info h2 { font-size: 22px; font-weight: 700; }
        .balance-info p { font-size: 11px; color: var(--text-secondary); margin-top: 5px; }

        .stats-row { display: flex; justify-content: space-around; margin-top: 30px; border-top: 1px solid #2c2c2e; padding-top: 20px; }
        .stat-item p { font-size: 11px; color: var(--text-secondary); margin-bottom: 5px; }
        .stat-item span { font-weight: 600; font-size: 13px; }

        /* LISTAS */
        .meta-card { background: var(--card-bg); border-radius: 20px; padding: 18px; margin-bottom: 12px; }
        .progress-bar { width: 100%; height: 6px; background: #333; border-radius: 3px; overflow: hidden; margin: 10px 0; }
        .progress-fill { height: 100%; background: var(--accent-purple); transition: 1s ease-in-out; }
        .transaction-item { background: #1c1c1e; padding: 15px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border: 1px solid #222; }

        /* NAV */
        .nav-bar { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); width: 92%; background: rgba(28, 28, 30, 0.95); backdrop-filter: blur(20px); border-radius: 30px; padding: 15px; display: flex; justify-content: space-around; align-items: center; border: 1px solid rgba(255,255,255,0.1); z-index: 1000; }
        .nav-btn { color: var(--text-secondary); font-size: 24px; cursor: pointer; }
        .nav-btn.active { color: var(--text-main); }
        .add-btn { background: white; color: black; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; margin-top: -50px; }

        /* MODAIS */
        #modalGeneric { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; padding: 40px 20px; }
        .modal-content { background: #1c1c1e; border-radius: 30px; padding: 30px; border: 1px solid #333; }
        input, select { width: 100%; padding: 16px; border-radius: 14px; border: none; background: #2c2c2e; color: white; margin-bottom: 15px; font-size: 16px; outline: none; }
        .btn-save { background: var(--accent-blue); color: white; padding: 18px; border-radius: 16px; border: none; width: 100%; font-weight: bold; }

        .view { display: none; }
        .view.active { display: block; }
    </style>
</head>
<body>

    <header class="header">
        <h1 id="headerTitle">Dashboard</h1>
        <div onclick="configOrcamento()" style="font-size: 20px; cursor: pointer;">⚙️</div>
    </header>

    <div id="viewHome" class="view active">
        <div class="main-widget">
            <div class="ring-container">
                <canvas id="balanceRing"></canvas>
                <div class="balance-info">
                    <h2 id="totalSaldo">R$ 0</h2>
                    <p>disponível</p>
                </div>
            </div>
            <div class="stats-row">
                <div class="stat-item" onclick="configOrcamento()"><p>Orçamento ></p><span id="budgetVal">R$ 0</span></div>
                <div class="stat-item"><p>Gasto ></p><span id="allocatedVal">R$ 0</span></div>
            </div>
        </div>

        <div style="margin-bottom:15px; font-weight:600;">Atividades</div>
        <div id="recentList"></div>
    </div>

    <div id="viewPlanejamento" class="view">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2>Metas</h2>
            <span onclick="openModal('meta')" style="color:var(--accent-blue); font-weight:600;">+ Nova</span>
        </div>
        <div id="metaList"></div>
    </div>

    <nav class="nav-bar">
        <div class="nav-btn active" onclick="navTab('viewHome', this)">🏠</div>
        <div class="nav-btn" onclick="navTab('viewPlanejamento', this)">🎯</div>
        <div class="add-btn" onclick="openModal('finance')">+</div>
        <div class="nav-btn" onclick="navTab('viewHome', this)">📊</div>
        <div class="nav-btn" onclick="navTab('viewHome', this)">👤</div>
    </nav>

    <div id="modalGeneric">
        <div class="modal-content">
            <h2 id="modalTitle" style="margin-bottom:20px;">Adicionar</h2>
            <div id="formFinance">
                <select id="finType"><option value="gasto">🔴 Saída</option><option value="ganho">🟢 Entrada</option></select>
                <input type="text" id="finDesc" placeholder="Descrição"><input type="number" id="finValue" placeholder="Valor R$" inputmode="decimal">
                <button class="btn-save" onclick="saveFinance()">Confirmar</button>
            </div>
            <div id="formMeta" style="display:none;">
                <input type="text" id="metaName" placeholder="Meta"><input type="number" id="metaTarget" placeholder="Alvo R$"><input type="number" id="metaCurrent" placeholder="Já tenho R$">
                <button class="btn-save" onclick="saveMeta()">Criar Meta</button>
            </div>
            <button onclick="closeModal()" style="background:none;border:none;color:var(--text-secondary);width:100%;margin-top:20px;">Fechar</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGKDP5V75gMI7uO4gpZL6IpV3teP6J4ao",
            authDomain: "appfamilia-5ebe4.firebaseapp.com",
            databaseURL: "https://appfamilia-5ebe4-default-rtdb.firebaseio.com",
            projectId: "appfamilia-5ebe4",
            storageBucket: "appfamilia-5ebe4.firebasestorage.app",
            messagingSenderId: "588166444818",
            appId: "1:588166444818:web:4dcc01e0c6d1608cbc65cb"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myChart = null;
        let globalOrcamento = 0;

        function initChart() {
            const canvas = document.getElementById('balanceRing');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [0, 100],
                        backgroundColor: ['#0a84ff', '#1c1c1e'],
                        borderWidth: 0, borderRadius: 20
                    }]
                },
                options: {
                    cutout: '85%', responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { enabled: false } }
                }
            });
        }

        // NOVO: Configura o orçamento no banco de dados
        async function configOrcamento() {
            const novo = prompt("Qual o seu orçamento mensal (R$)?", globalOrcamento);
            if (novo !== null) {
                const valor = parseFloat(novo);
                if (!isNaN(valor)) {
                    await db.ref("config/orcamento").set(valor);
                }
            }
        }

        function syncData() {
            // Escuta o orçamento
            db.ref("config/orcamento").on('value', snap => {
                globalOrcamento = snap.val() || 0;
                document.getElementById('budgetVal').innerText = `R$ ${globalOrcamento.toLocaleString()}`;
                // Força atualização do dashboard após ler o orçamento
                db.ref("financas").once('value', snapFin => updateDashboard(snapFin));
            });

            // Escuta as finanças
            db.ref("financas").on('value', snap => updateDashboard(snap));
        }

        function updateDashboard(snap) {
            let gas = 0;
            const list = document.getElementById('recentList');
            if (list) list.innerHTML = '';
            
            snap.forEach(c => {
                const f = c.val();
                if (f.tipo === 'gasto') gas += f.valor;
                if (list) {
                    list.innerHTML = `<div class="transaction-item"><b>${f.descricao}</b><span>R$ ${f.valor.toLocaleString()}</span></div>` + list.innerHTML;
                }
            });

            const disponivel = globalOrcamento - gas;
            document.getElementById('totalSaldo').innerText = `R$ ${disponivel.toLocaleString()}`;
            document.getElementById('allocatedVal').innerText = `R$ ${gas.toLocaleString()}`;

            if (myChart && globalOrcamento > 0) {
                myChart.data.datasets[0].data = [gas, Math.max(0, globalOrcamento - gas)];
                myChart.update();
            }
        }

        // Funções de UI
        function navTab(viewId, element) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            element.classList.add('active');
            if(viewId === 'viewPlanejamento') fetchMetas();
        }

        function openModal(mode) {
            document.getElementById('modalGeneric').style.display = 'block';
            const isFin = mode === 'finance';
            document.getElementById('formFinance').style.display = isFin ? 'block' : 'none';
            document.getElementById('formMeta').style.display = isFin ? 'none' : 'block';
        }

        function closeModal() { document.getElementById('modalGeneric').style.display = 'none'; }

        async function saveFinance() {
            const t = document.getElementById('finType').value;
            const d = document.getElementById('finDesc').value;
            const v = parseFloat(document.getElementById('finValue').value) || 0;
            if(!d || v <= 0) return;
            await db.ref("financas").push({ tipo: t, descricao: d, valor: v, data: firebase.database.ServerValue.TIMESTAMP });
            closeModal();
        }

        async function saveMeta() {
            const n = document.getElementById('metaName').value;
            const t = parseFloat(document.getElementById('metaTarget').value) || 0;
            const c = parseFloat(document.getElementById('metaCurrent').value) || 0;
            if(!n || t <= 0) return;
            await db.ref("metas").push({ nome: n, alvo: t, atual: c });
            closeModal();
            fetchMetas();
        }

        async function fetchMetas() {
            const list = document.getElementById('metaList'); list.innerHTML = '';
            const snap = await db.ref("metas").once('value');
            snap.forEach(c => {
                const m = c.val();
                const pct = Math.min(100, (m.atual / m.alvo) * 100).toFixed(1);
                list.innerHTML += `
                <div class="meta-card">
                    <div style="display:flex; justify-content:space-between;"><b>${m.nome}</b><span>R$ ${m.atual}</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width: ${pct}%"></div></div>
                </div>`;
            });
        }

        window.onload = () => {
            initChart();
            syncData();
        };
    </script>
</body>
</html>
