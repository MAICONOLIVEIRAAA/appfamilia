<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BrimChat AI - Debug Mode</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-dark: #0b141a; --bg-panel: #111b21; --accent: #00a884;
            --bubble-me: #005c4b; --bubble-ai: #1e2a30; --text: #e9edef;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: var(--bg-dark); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        .chat-header { background: var(--bg-panel); padding: 15px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #222; }
        .ai-avatar { width: 40px; height: 40px; background: var(--accent); border-radius: 50%; display: grid; place-items: center; font-weight: bold; color: #000; }

        #chatWindow { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }

        .msg { max-width: 85%; padding: 12px 16px; border-radius: 12px; font-size: 15px; line-height: 1.5; }
        .msg.me { align-self: flex-end; background: var(--bubble-me); border-top-right-radius: 2px; }
        .msg.ai { align-self: flex-start; background: var(--bubble-ai); border-top-left-radius: 2px; border: 1px solid #333; }
        
        .input-area { background: var(--bg-panel); padding: 10px; display: flex; align-items: center; gap: 10px; }
        #msgInput { flex: 1; background: #2a3942; border: none; padding: 15px; border-radius: 25px; color: white; outline: none; font-size: 15px; }
        .btn-send { background: var(--accent); width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; border: none; cursor: pointer; font-size: 20px; }

        #aiTyping { font-size: 12px; color: var(--accent); padding: 0 20px 10px 20px; display: none; font-style: italic; }
    </style>
</head>
<body>

    <header class="chat-header">
        <div class="ai-avatar">AI</div>
        <div>
            <b style="font-size: 16px;">Brim Assistente (Debug)</b><br>
            <small style="color: var(--accent);">Sala: chat_teste_api</small>
        </div>
    </header>

    <div id="chatWindow"></div>
    <div id="aiTyping">Processando na nuvem...</div>

    <div class="input-area">
        <input type="text" id="msgInput" placeholder="Digite 'Oi' para testar..." onkeypress="if(event.key==='Enter') handleUserMessage()">
        <button class="btn-send" onclick="handleUserMessage()">➤</button>
    </div>

    <script>
        console.log("🚀 Javascript carregado com sucesso!");

        // 1. CHAVE E FIREBASE
        const API_KEY = "AIzaSyBIBCta_wFjw1dPMs-ZZSGB4D0JA4k2PzM"; 
        
        const firebaseConfig = {
            apiKey: "AIzaSyBGKDP5V75gMI7uO4gpZL6IpV3teP6J4ao",
            authDomain: "appfamilia-5ebe4.firebaseapp.com",
            databaseURL: "https://appfamilia-5ebe4-default-rtdb.firebaseio.com",
            projectId: "appfamilia-5ebe4",
            storageBucket: "appfamilia-5ebe4.firebasestorage.app",
            messagingSenderId: "588166444818",
            appId: "1:588166444818:web:4dcc01e0c6d1608cbc65cb"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const currentUser = "Pablo"; 

        // 2. ENVIO DE MENSAGEM
        async function handleUserMessage() {
            const input = document.getElementById('msgInput');
            const userText = input.value.trim();
            if(!userText) return;

            console.log("Mensagem do usuário:", userText);
            input.value = "";
            await saveMessageToDB(currentUser, userText);

            document.getElementById('aiTyping').style.display = 'block';

            try {
                const aiResponse = await chamarInteligenciaArtificial(userText);
                console.log("Resposta da IA recebida!");
                await saveMessageToDB("Brim AI", aiResponse);
            } catch (error) {
                console.error("❌ ERRO NA API:", error);
                await saveMessageToDB("Brim AI", `⚠️ Erro Técnico: ${error.message}`);
            } finally {
                document.getElementById('aiTyping').style.display = 'none';
            }
        }

        // 3. COMUNICAÇÃO COM O GOOGLE
        async function chamarInteligenciaArtificial(prompt) {
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
            const payload = { contents: [{ parts: [{ text: prompt }] }] };

            const resposta = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!resposta.ok) {
                const errorData = await resposta.json();
                throw new Error(errorData.error.message || `Erro HTTP ${resposta.status}`);
            }
            
            const dados = await resposta.json();
            return dados.candidates[0].content.parts[0].text;
        }

        // 4. SALVAR NO FIREBASE
        async function saveMessageToDB(user, text) {
            // MUDANÇA AQUI: Criamos um nó novo para evitar o erro antigo salvo!
            await db.ref("chat_teste_api").push({
                user: user,
                text: text,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
        }

        // 5. CARREGAR MENSAGENS
        function initChat() {
            const chat = document.getElementById('chatWindow');

            // MUDANÇA AQUI: Escutando o nó novo!
            db.ref("chat_teste_api").orderByChild("timestamp").on('value', snap => {
                chat.innerHTML = "";
                snap.forEach(child => {
                    const m = child.val();
                    const isMe = m.user === currentUser;
                    
                    chat.innerHTML += `
                        <div class="msg ${isMe ? 'me' : 'ai'}">
                            <b>${m.user}</b><br>
                            ${m.text.replace(/\n/g, '<br>')}
                            <div style="font-size:9px; text-align:right; opacity:0.5; margin-top:6px;">${m.time}</div>
                        </div>
                    `;
                });
                chat.scrollTop = chat.scrollHeight; 
            });
        }

        window.onload = initChat;
    </script>
</body>
</html>
