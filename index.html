<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AppFamilia</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root { --gold: #d4af37; --dark: #121212; --gray: #1e1e1e; --light-gray: #2c2c2c; --text: #e0e0e0; --red: #ff5252; --green: #4caf50; --blue: #3498db; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--dark); color: var(--text); padding-bottom: 90px; padding-top: 60px;
        }

        .app-header {
            position: fixed; top: 0; left: 0; width: 100%;
            background: rgba(18, 18, 18, 0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            padding: 15px; text-align: center; z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .app-header h1 { font-size: 1.3em; color: var(--gold); letter-spacing: 1px; margin: 0; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; background: var(--gray);
            display: flex; justify-content: space-around; align-items: center;
            padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
            border-top: 1px solid rgba(255,255,255,0.05); z-index: 1000;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #777; font-size: 0.75em; gap: 4px; width: 25%; }
        .nav-item.active { color: var(--gold); font-weight: bold; }
        .nav-item .icon { font-size: 1.6em; }

        .app-container { padding: 15px; width: 100%; max-width: 600px; margin: 0 auto; }
        .view { display: none; flex-direction: column; gap: 20px; animation: fadeIn 0.4s ease; }
        .view.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--gray); padding: 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.03); }
        .form-group { display: flex; flex-direction: column; gap: 12px; }
        select, input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #333; font-size: 16px; background: #222; color: white; outline: none; }
        .btn { background: var(--gold); color: #000; font-weight: bold; padding: 16px; border-radius: 12px; border: none; text-transform: uppercase; letter-spacing: 1px; }

        .item-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
        .list-item { background: #222; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--gold); }
        .registro-info b { display: block; font-size: 15px; color: white; }
        .registro-data { font-size: 12px; color: #888; }
        .tag-recorrente { font-size: 9px; background: rgba(212, 175, 55, 0.2); color: var(--gold); padding: 2px 6px; border-radius: 4px; margin-left: 5px; border: 1px solid var(--gold); }
        
        .delete-btn { font-size: 1.3em; background: rgba(255,0,0,0.1); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <header class="app-header"><h1>AppFamilia</h1></header>

    <div class="app-container">
        <div id="viewLancamento" class="view">
            <div class="card">
                <h2>Lançar Finanças</h2>
                <div class="form-group">
                    <select id="finType"><option value="gasto">🔴 Saída</option><option value="ganho">🟢 Entrada</option></select>
                    <input type="text" id="finDesc" placeholder="Descrição">
                    <input type="number" id="finValue" placeholder="Valor (R$)" inputmode="decimal">
                    <button class="btn" onclick="addFinance()">Registrar</button>
                </div>
            </div>
        </div>

        <div id="viewTarefas" class="view active">
            <div class="card">
                <h2>Novo Lembrete</h2>
                <div class="form-group">
                    <input type="text" id="taskInput" placeholder="O que lembrar?">
                    <input type="time" id="taskTime">
                    <select id="taskFreq">
                        <option value="uma_vez">🔔 Uma vez</option>
                        <option value="diario">🔁 Diário</option>
                    </select>
                    <button class="btn" onclick="addTask()">Salvar Lembrete</button>
                </div>
            </div>
            
            <div class="card" style="background:transparent; border:none;">
                <h2>Meus Lembretes</h2>
                <ul id="taskList" class="item-list"></ul>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item" onclick="navTab('viewLancamento', this)"><span class="icon">➕</span><span>Lançar</span></div>
        <div class="nav-item active" onclick="navTab('viewTarefas', this)"><span class="icon">📝</span><span>Tarefas</span></div>
    </nav>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGKDP5V75gMI7uO4gpZL6IpV3teP6J4ao",
            authDomain: "appfamilia-5ebe4.firebaseapp.com",
            databaseURL: "https://appfamilia-5ebe4-default-rtdb.firebaseio.com",
            projectId: "appfamilia-5ebe4",
            storageBucket: "appfamilia-5ebe4.firebasestorage.app",
            messagingSenderId: "588166444818",
            appId: "1:588166444818:web:4dcc01e0c6d1608cbc65cb"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function navTab(viewId, element) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            if(viewId === 'viewTarefas') fetchTasks();
        }

        // --- LÓGICA DE NOTIFICAÇÃO RECORRENTE ---
        function showNotification(msg) {
            if (Notification.permission === "granted") {
                new Notification("Lembrete AppFamilia", { body: msg });
            } else {
                alert("LEMBRETE: " + msg);
            }
        }

        setInterval(() => {
            const agora = new Date();
            const hojeStr = agora.toISOString().split('T')[0]; // Formato YYYY-MM-DD
            const horaAtual = agora.getHours().toString().padStart(2, '0') + ":" + agora.getMinutes().toString().padStart(2, '0');

            db.ref("tarefas").once('value', snap => {
                snap.forEach(child => {
                    const t = child.val();
                    if (t.hora === horaAtual) {
                        // Se for diário e ainda não notificou HOJE
                        if (t.frequencia === 'diario' && t.ultimaNotificacao !== hojeStr) {
                            showNotification(t.texto);
                            db.ref("tarefas").child(child.key).update({ ultimaNotificacao: hojeStr });
                        } 
                        // Se for uma vez e ainda não notificou NUNCA
                        else if (t.frequencia === 'uma_vez' && !t.notificado) {
                            showNotification(t.texto);
                            db.ref("tarefas").child(child.key).update({ notificado: true });
                        }
                    }
                });
            });
        }, 60000);

        // --- TAREFAS ---
        async function addTask() {
            const val = document.getElementById('taskInput').value;
            const time = document.getElementById('taskTime').value;
            const freq = document.getElementById('taskFreq').value;
            if (!val || !time) return alert("Preencha descrição e hora.");

            await db.ref("tarefas").push({ 
                texto: val, 
                hora: time, 
                frequencia: freq,
                notificado: false, 
                ultimaNotificacao: "",
                dataCriacao: firebase.database.ServerValue.TIMESTAMP 
            });

            document.getElementById('taskInput').value = '';
            fetchTasks();
            if (Notification.permission !== "granted") Notification.requestPermission();
        }

        async function fetchTasks() {
            const snap = await db.ref("tarefas").once('value');
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            snap.forEach(c => {
                const t = c.val();
                const badge = t.frequencia === 'diario' ? '<span class="tag-recorrente">DIÁRIO</span>' : '';
                list.innerHTML = `
                <li class="list-item">
                    <div class="registro-info">
                        <b>${t.texto} ${badge}</b>
                        <span class="registro-data">⏰ ${t.hora}</span>
                    </div>
                    <div class="delete-btn" onclick="deleteTask('${c.key}')">✅</div>
                </li>` + list.innerHTML;
            });
        }

        async function deleteTask(id) { await db.ref("tarefas").child(id).remove(); fetchTasks(); }

        window.onload = () => { fetchTasks(); };
    </script>
</body>
</html>
