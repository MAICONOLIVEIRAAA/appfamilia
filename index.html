<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AppFamilia Nu</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root { 
            --nu-purple: #820ad1; 
            --nu-dark-purple: #6a08aa;
            --bg-gray: #f5f5f5; 
            --card-white: #ffffff;
            --text-black: #111111;
            --text-gray: #767676;
            --green: #2ecc71;
            --red: #e74c3c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: 'Graphik', 'Inter', -apple-system, sans-serif; 
            background-color: var(--bg-gray); 
            color: var(--text-black); 
            padding-bottom: 120px; 
            padding-top: 20px;
        }

        .app-container { padding: 20px; width: 100%; max-width: 500px; margin: 0 auto; }

        /* HEADER ESTILO NU */
        .nu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: var(--nu-purple);
            color: white;
            border-radius: 0 0 24px 24px;
            margin-top: -20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .nu-header h1 { font-size: 1.2em; font-weight: 600; }

        /* CARDS ESTILO NUBANK */
        .card { 
            background: var(--card-white); 
            padding: 24px; 
            border-radius: 24px; 
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #eee;
            transition: 0.3s;
        }
        .card h2 { font-size: 1.1em; color: var(--text-gray); margin-bottom: 15px; font-weight: 500; }

        /* SALDO EM DESTAQUE */
        .balance-value { font-size: 1.8em; font-weight: 700; color: var(--text-black); margin: 10px 0; }
        .nu-label { color: var(--nu-purple); font-weight: 600; font-size: 0.9em; }

        /* INPUTS MODERNOS */
        .form-group { display: flex; flex-direction: column; gap: 15px; }
        input, select { 
            width: 100%; 
            padding: 16px; 
            border-radius: 12px; 
            border: none; 
            background: #f0f0f0; 
            font-size: 16px; 
            color: var(--text-black);
            outline: none;
        }
        input:focus { background: #e8e8e8; border-bottom: 2px solid var(--nu-purple); }

        /* BOTÃO ROXO */
        .btn-nu { 
            background: var(--nu-purple); 
            color: white; 
            font-weight: 600; 
            padding: 18px; 
            border-radius: 30px; 
            border: none; 
            text-transform: none; 
            font-size: 1.1em;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(130, 10, 209, 0.2);
        }
        .btn-nu:active { background: var(--nu-dark-purple); transform: scale(0.98); }

        /* LISTAS LIMPAS */
        .item-list { list-style: none; }
        .list-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px 0; 
            border-bottom: 1px solid #f0f0f0; 
        }
        .list-item:last-child { border-bottom: none; }
        .item-info b { font-size: 1em; color: var(--text-black); }
        .item-info p { font-size: 0.85em; color: var(--text-gray); }

        /* MENU INFERIOR NU */
        .bottom-nav { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            background: white; 
            display: flex; 
            justify-content: space-around; 
            padding: 15px 0 30px 0; 
            border-top: 1px solid #eee;
            z-index: 1000;
        }
        .nav-item { color: #ccc; text-align: center; font-size: 0.75em; width: 25%; font-weight: 500; }
        .nav-item.active { color: var(--nu-purple); }
        .nav-item span { display: block; font-size: 24px; margin-bottom: 4px; }

        /* VIEW SYSTEM */
        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .chart-container { height: 250px; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <header class="nu-header">
        <h1>Olá, Pablo</h1>
        <div style="background: rgba(255,255,255,0.2); padding: 10px; border-radius: 50%;">👤</div>
    </header>

    <div class="app-container">
        
        <div id="viewHome" class="view active">
            <div class="card" onclick="navTab('viewExtrato', document.querySelectorAll('.nav-item')[2])">
                <p class="nu-label">Conta</p>
                <p class="balance-value" id="resumoSaldo">R$ 0,00</p>
                <p style="font-size: 0.85em; color: var(--text-gray);">Saldo disponível</p>
            </div>

            <div class="card">
                <p class="nu-label">Meus Gastos</p>
                <div class="chart-container"><canvas id="monthlyChart"></canvas></div>
            </div>
        </div>

        <div id="viewLancamento" class="view">
            <div class="card">
                <h2>O que deseja fazer?</h2>
                <div class="form-group">
                    <select id="finType">
                        <option value="gasto">Pagar Conta (Saída)</option>
                        <option value="ganho">Receber Valor (Entrada)</option>
                    </select>
                    <input type="text" id="finDesc" placeholder="Descrição (ex: Mercado)">
                    <input type="number" id="finValue" placeholder="Valor R$" inputmode="decimal">
                    <button class="btn-nu" onclick="addFinance()">Confirmar</button>
                </div>
            </div>
        </div>

        <div id="viewExtrato" class="view">
            <div class="card">
                <h2>Histórico</h2>
                <ul id="finList" class="item-list"></ul>
            </div>
        </div>

        <div id="viewTarefas" class="view">
            <div class="card">
                <h2>Lembretes</h2>
                <div class="form-group">
                    <input type="text" id="taskInput" placeholder="O que lembrar?">
                    <input type="time" id="taskTime">
                    <button class="btn-nu" onclick="addTask()">Salvar Lembrete</button>
                </div>
            </div>
            <div class="card">
                <ul id="taskList" class="item-list"></ul>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="navTab('viewHome', this)"><span>🏠</span>Início</div>
        <div class="nav-item" onclick="navTab('viewLancamento', this)"><span>💸</span>Lançar</div>
        <div class="nav-item" onclick="navTab('viewExtrato', this)"><span>📊</span>Extrato</div>
        <div class="nav-item" onclick="navTab('viewTarefas', this)"><span>⏰</span>Agenda</div>
    </nav>

    <script>
        // CONFIG FIREBASE (O SEU)
        const firebaseConfig = {
            apiKey: "AIzaSyBGKDP5V75gMI7uO4gpZL6IpV3teP6J4ao",
            authDomain: "appfamilia-5ebe4.firebaseapp.com",
            databaseURL: "https://appfamilia-5ebe4-default-rtdb.firebaseio.com",
            projectId: "appfamilia-5ebe4",
            storageBucket: "appfamilia-5ebe4.firebasestorage.app",
            messagingSenderId: "588166444818",
            appId: "1:588166444818:web:4dcc01e0c6d1608cbc65cb"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function navTab(viewId, element) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            if(viewId === 'viewHome' || viewId === 'viewExtrato') fetchFinance();
            if(viewId === 'viewTarefas') fetchTasks();
        }

        async function addFinance() {
            const type = document.getElementById('finType').value;
            const desc = document.getElementById('finDesc').value;
            const val = parseFloat(document.getElementById('finValue').value) || 0;
            if(!desc || val <= 0) return alert("Preencha os dados!");

            await db.ref("financas").push({
                tipo: type, descricao: desc, valor: val,
                mesCriacao: new Date().toISOString().substring(0, 7),
                data: firebase.database.ServerValue.TIMESTAMP
            });
            alert("Lançado!");
            document.getElementById('finDesc').value = '';
            document.getElementById('finValue').value = '';
            navTab('viewHome', document.querySelectorAll('.nav-item')[0]);
        }

        let monthlyChart;
        async function fetchFinance() {
            const currentMonth = new Date().toISOString().substring(0, 7);
            const snap = await db.ref("financas").once('value');
            let gan = 0, gas = 0;
            const list = document.getElementById('finList'); 
            if(list) list.innerHTML = '';

            snap.forEach(c => {
                const f = c.val();
                if(f.mesCriacao === currentMonth || !f.mesCriacao) {
                    if(f.tipo === 'ganho') gan += f.valor; else gas += f.valor;
                    if(list) {
                        list.innerHTML = `
                        <li class="list-item">
                            <div class="item-info"><b>${f.descricao}</b><p>${f.tipo==='ganho'?'Recebido':'Pago'}</p></div>
                            <b style="color:${f.tipo==='ganho'?'var(--green)':'var(--text-black)'}">R$ ${f.valor.toFixed(2)}</b>
                        </li>` + list.innerHTML;
                    }
                }
            });

            document.getElementById('resumoSaldo').innerText = `R$ ${(gan - gas).toFixed(2)}`;
            renderChart(gan, gas);
        }

        function renderChart(gan, gas) {
            const ctx = document.getElementById('monthlyChart').getContext('2d');
            if(monthlyChart) monthlyChart.destroy();
            monthlyChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Entradas', 'Saídas'],
                    datasets: [{ data: [gan, gas], backgroundColor: ['#2ecc71', '#820ad1'], borderWidth: 0 }]
                },
                options: { responsive: true, maintainAspectRatio: false, cutout: '80%', plugins: { legend: { position: 'bottom' } } }
            });
        }

        async function addTask() {
            const txt = document.getElementById('taskInput').value;
            const time = document.getElementById('taskTime').value;
            if(!txt) return;
            await db.ref("tarefas").push({ texto: txt, hora: time });
            document.getElementById('taskInput').value = '';
            fetchTasks();
        }

        async function fetchTasks() {
            const list = document.getElementById('taskList'); list.innerHTML = '';
            const snap = await db.ref("tarefas").once('value');
            snap.forEach(c => {
                list.innerHTML = `<li class="list-item"><b>${c.val().hora || ''} ${c.val().texto}</b><span onclick="db.ref('tarefas').child('${c.key}').remove(); fetchTasks();">✅</span></li>` + list.innerHTML;
            });
        }

        window.onload = () => { fetchFinance(); fetchTasks(); };
    </script>
</body>
</html>
