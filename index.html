<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AppFamilia - Maicon</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        :root { --gold: #d4af37; --dark: #121212; --gray: #1e1e1e; --light-gray: #2c2c2c; --text: #e0e0e0; --red: #e74c3c; --green: #2ecc71; }
        
        /* Reset para Mobile */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--dark); 
            color: var(--text); 
            padding-bottom: 40px; /* Espaço para rolar até o final suavemente */
        }

        /* Container que simula a tela do app */
        .app-container { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            padding: 15px; 
            width: 100%; 
            max-width: 500px; /* Mantém bonito se abrir no PC, mas perfeito no celular */
            margin: 0 auto; 
        }

        h1 { text-align: center; color: var(--gold); margin: 10px 0; font-size: 1.8em; }
        h2 { font-size: 1.2em; color: var(--gold); margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 5px; }

        /* Cartões de Rolagem */
        .card { 
            background: var(--gray); 
            padding: 20px; 
            border-radius: 12px; 
            border-top: 3px solid var(--gold); 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
        }

        /* Resumo de Saldo Mobile */
        .balance-box { display: flex; justify-content: space-between; align-items: center; text-align: center; background: var(--light-gray); padding: 15px; border-radius: 10px; }
        .balance-item h3 { font-size: 0.8em; color: #aaa; font-weight: normal; margin-bottom: 5px; }
        .balance-item p { font-size: 1.1em; font-weight: bold; }
        .val-ganho { color: var(--green); }
        .val-gasto { color: var(--red); }
        .val-saldo { font-size: 1.3em !important; } /* Destaca o saldo principal */

        /* Formulários e Botões (Touch-friendly) */
        .form-group { display: flex; flex-direction: column; gap: 12px; }
        
        /* Fonte 16px previne auto-zoom no iPhone/Android */
        select, input, button { 
            width: 100%; 
            padding: 15px; 
            border-radius: 8px; 
            border: none; 
            font-size: 16px; 
            outline: none;
        }
        
        input, select { background: var(--light-gray); color: white; border: 1px solid #444; }
        input:focus, select:focus { border-color: var(--gold); }
        
        .btn { background: var(--gold); color: #000; font-weight: bold; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .btn:active { background: #f1c40f; transform: scale(0.98); } /* Efeito de clique no touch */

        /* Lista de Tarefas */
        .task-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .task-item { 
            background: var(--light-gray); 
            padding: 15px; 
            border-radius: 8px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-left: 4px solid var(--gold); 
            font-size: 16px;
        }
        .task-delete { font-size: 1.2em; padding: 5px 10px; cursor: pointer; }

        /* Gráfico Mobile */
        .chart-container { position: relative; height: 250px; width: 100%; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="app-container">
        <h1>AppFamilia</h1>

        <div class="balance-box">
            <div class="balance-item">
                <h3>Ganhos</h3>
                <p id="totalGanho" class="val-ganho">R$ 0</p>
            </div>
            <div class="balance-item">
                <h3>Saldo Atual</h3>
                <p id="totalSaldo" class="val-saldo">R$ 0</p>
            </div>
            <div class="balance-item">
                <h3>Gastos</h3>
                <p id="totalGasto" class="val-gasto">R$ 0</p>
            </div>
        </div>

        <div class="card">
            <h2>Lançar Finanças</h2>
            <div class="form-group">
                <select id="finType">
                    <option value="ganho">🟢 Nova Entrada (Ganho)</option>
                    <option value="gasto">🔴 Nova Saída (Gasto)</option>
                </select>
                <input type="text" id="finDesc" placeholder="Descrição (Ex: Luz, Salário)">
                <input type="number" id="finValue" placeholder="Valor (R$)" inputmode="decimal">
                <button class="btn" onclick="addFinance()">Salvar Lançamento</button>
            </div>
        </div>

        <div class="card">
            <h2>Visão Geral</h2>
            <div class="chart-container">
                <canvas id="financeChart"></canvas>
            </div>
        </div>

        <div class="card">
            <h2>Lembretes & Tarefas</h2>
            <div class="form-group" style="margin-bottom: 15px;">
                <input type="text" id="taskInput" placeholder="O que precisa ser feito?">
                <button class="btn" onclick="addTask()">Adicionar Tarefa</button>
            </div>
            <ul id="taskList" class="task-list">
                </ul>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO FIREBASE DO MAICON
        const firebaseConfig = {
            apiKey: "AIzaSyAMxvTVuD11Rm_EfEpVVQ8kkaUApEEdHvg",
            authDomain: "midias-sp.firebaseapp.com",
            projectId: "midias-sp",
            appId: "1:550605985336:web:c21f69ef4180e30275b8cd"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- FUNÇÕES FINANCEIRAS ---
        async function addFinance() {
            const type = document.getElementById('finType').value;
            const desc = document.getElementById('finDesc').value;
            const valInput = document.getElementById('finValue').value;
            // Trata vírgula como ponto para o formato numérico
            const val = parseFloat(valInput.replace(',', '.'));

            if (!desc || !val) {
                alert("Preencha a descrição e o valor!");
                return;
            }

            // Desativa o botão para evitar duplicação no celular
            const btn = document.querySelector('.card:nth-child(2) .btn');
            btn.innerText = "Salvando...";
            btn.disabled = true;

            try {
                await db.collection("financas").add({
                    tipo: type,
                    descricao: desc,
                    valor: val,
                    data: firebase.firestore.FieldValue.serverTimestamp()
                });

                document.getElementById('finDesc').value = '';
                document.getElementById('finValue').value = '';
                fetchFinance();
            } catch (error) {
                alert("Erro ao salvar. Verifique o console.");
            } finally {
                btn.innerText = "Salvar Lançamento";
                btn.disabled = false;
            }
        }

        let myChart;
        async function fetchFinance() {
            const snap = await db.collection("financas").get();
            let ganhos = 0, gastos = 0;
            const categorias = { "Ganhos": 0, "Gastos": 0 };

            snap.forEach(doc => {
                const d = doc.data();
                if (d.tipo === 'ganho') {
                    ganhos += d.valor;
                    categorias["Ganhos"] += d.valor;
                } else {
                    gastos += d.valor;
                    categorias["Gastos"] += d.valor;
                }
            });

            // Formatação de moeda BRL para tela do celular
            const formataMoeda = (valor) => valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

            document.getElementById('totalGanho').innerText = formataMoeda(ganhos);
            document.getElementById('totalGasto').innerText = formataMoeda(gastos);
            
            const saldo = ganhos - gastos;
            const saldoEl = document.getElementById('totalSaldo');
            saldoEl.innerText = formataMoeda(saldo);
            saldoEl.style.color = saldo >= 0 ? 'var(--green)' : 'var(--red)';

            renderChart(categorias);
        }

        function renderChart(cats) {
            const ctx = document.getElementById('financeChart').getContext('2d');
            if (myChart) myChart.destroy();
            
            // Se estiver tudo zerado, mostra gráfico cinza
            if(cats.Ganhos === 0 && cats.Gastos === 0) {
                cats = {"Sem dados": 1};
            }

            myChart = new Chart(ctx, {
                type: 'doughnut', // Doughnut fica mais elegante no mobile
                data: {
                    labels: Object.keys(cats),
                    datasets: [{ 
                        data: Object.values(cats), 
                        backgroundColor: cats["Sem dados"] ? ['#555'] : ['#2ecc71', '#e74c3c'],
                        borderWidth: 0
                    }]
                },
                options: { 
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { position: 'bottom', labels: { color: '#fff', padding: 20 } } 
                    },
                    cutout: '70%'
                }
            });
        }

        // --- FUNÇÕES DE TAREFAS ---
        async function addTask() {
            const val = document.getElementById('taskInput').value;
            if (!val) return;
            
            const btn = document.querySelector('.card:last-child .btn');
            btn.innerText = "Adicionando...";
            
            await db.collection("tarefas").add({ texto: val, data: new Date() });
            document.getElementById('taskInput').value = '';
            btn.innerText = "Adicionar Tarefa";
            fetchTasks();
        }

        async function fetchTasks() {
            const snap = await db.collection("tarefas").orderBy("data", "desc").limit(10).get();
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            snap.forEach(doc => {
                list.innerHTML += `
                    <li class="task-item">
                        <span>${doc.data().texto}</span>
                        <span class="task-delete" onclick="deleteTask('${doc.id}')">✅</span>
                    </li>`;
            });
        }

        async function deleteTask(id) {
            await db.collection("tarefas").doc(id).delete();
            fetchTasks();
        }

        // Inicia o app carregando as funções
        window.onload = () => { fetchFinance(); fetchTasks(); };
    </script>
</body>
</html>
