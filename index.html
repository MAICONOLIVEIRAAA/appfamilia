<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeuPad - Compartilhamento</title>
    <style>
        body, html { 
            margin: 0; padding: 0; font-family: sans-serif; 
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); 
            color: #333; height: 100vh; overflow: hidden; 
        }
        
        /* Barra Superior - Estilo Liquid Glass */
        .topbar {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
            border-radius: 50px;
            height: 60px; padding: 0 30px; margin: 20px;
        }

        .logo { font-size: 20px; font-weight: bold; }
        .menu { display: flex; gap: 15px; align-items: center; }
        
        .btn-login { background: rgba(255, 255, 255, 0.5); border: 1px solid rgba(255, 255, 255, 0.6); padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-pro { background: #ffaa00; color: white; border: none; padding: 8px 20px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer; }

        /* Área do Texto */
        .pad-area { height: calc(100vh - 120px); padding: 0 20px 20px 20px; box-sizing: border-box; }
        textarea { width: 100%; height: 100%; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.6); border-radius: 16px; padding: 25px; resize: none; font-size: 18px; outline: none; box-sizing: border-box; }

        /* Modais */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); justify-content: center; align-items: center; z-index: 999; }
        .modal-content { background: white; padding: 30px; border-radius: 16px; text-align: center; width: 90%; max-width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .btn-acao { background: #28a745; color: white; border: none; padding: 12px; width: 100%; border-radius: 30px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .close-btn { float: right; font-size: 20px; font-weight: bold; cursor: pointer; color: #888; }
    </style>
</head>
<body>

    <!-- Barra Superior -->
    <div class="topbar">
        <div class="logo">MeuPad</div>
        <div class="menu">
            <button class="btn-login" onclick="abrirModalLogin()">Login</button>
            <button class="btn-pro" onclick="abrirModalPro()">Seja PRO</button>
        </div>
    </div>

    <!-- Área de Texto -->
    <div class="pad-area">
        <textarea id="texto-pad" placeholder="Carregando..."></textarea>
    </div>

    <!-- Modal de Bloqueio por Senha -->
    <div class="modal-overlay" id="modalBloqueio">
        <div class="modal-content">
            <h2>Link Protegido 🔒</h2>
            <p>Este pad requer uma senha para ser acessado.</p>
            <input type="password" id="input-senha-acesso" placeholder="Digite a senha" style="width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box;">
            <button class="btn-acao" onclick="verificarSenhaAcesso()">Acessar Pad</button>
        </div>
    </div>

    <!-- Modal Login -->
    <div class="modal-overlay" id="modalLogin">
        <div class="modal-content">
            <span class="close-btn" onclick="fecharModalLogin()">&times;</span>
            <h2 id="titulo-auth">Acesse sua conta</h2>
            <form onsubmit="fazerLogin(event)">
                <div class="form-group"><input type="email" id="email" required placeholder="E-mail"></div>
                <div class="form-group"><input type="password" id="senha" required placeholder="Senha"></div>
                <button type="submit" class="btn-acao" id="btn-submit-auth">Entrar</button>
            </form>
        </div>
    </div>

    <!-- [Modal PRO omitido por espaço, mas você pode manter o que já tinha] -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const clienteSupabase = window.supabase.createClient(
            'https://fcrgbdkiqnqtgmzevarh.supabase.co', 
            'sb_publishable_epnSTe_H_mCleZdgyl_AYw_8xGgRueS'
        );

        const textarea = document.getElementById('texto-pad');
        let padSlug = window.location.hash.substring(1) || 'padrao'; 
        let timeout;

        async function carregarPad() {
            const { data, error } = await clienteSupabase
                .from('pads')
                .select('text_content, password_hash, password_salt')
                .eq('slug', padSlug)
                .single(); 

            if (data && data.password_hash) {
                document.getElementById('modalBloqueio').style.display = 'flex';
                textarea.value = '';
                textarea.placeholder = "Conteúdo protegido por senha.";
            } else if (data) {
                textarea.value = data.text_content;
                textarea.placeholder = "Comece a digitar aqui...";
            }
        }

        async function verificarSenhaAcesso() {
            const senhaDigitada = document.getElementById('input-senha-acesso').value;
            const { data } = await clienteSupabase
                .from('pads')
                .select('text_content, password_hash, password_salt')
                .eq('slug', padSlug)
                .single();

            if (data && btoa(senhaDigitada + data.password_salt) === data.password_hash) {
                document.getElementById('modalBloqueio').style.display = 'none';
                textarea.value = data.text_content;
            } else {
                alert("Senha incorreta!");
            }
        }

        // Auto-save
        async function salvarPad() {
            const texto = textarea.value;
            await clienteSupabase.from('pads').upsert({ slug: padSlug, text_content: texto }, { onConflict: 'slug' });
        }
        textarea.addEventListener('input', () => { clearTimeout(timeout); timeout = setTimeout(salvarPad, 1000); });

        // Funções dos modais (mantidas)
        function abrirModalLogin() { document.getElementById('modalLogin').style.display = 'flex'; }
        function fecharModalLogin() { document.getElementById('modalLogin').style.display = 'none'; }
        function abrirModalPro() { /* sua lógica pro */ }

        carregarPad();
    </script>
</body>
</html>
