<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brim Racer - Pro</title>
    <style>
        body { 
            margin: 0; background: #000; overflow: hidden; 
            font-family: sans-serif; color: white; touch-action: none;
        }
        canvas { display: block; }
        #ui {
            position: absolute; top: 20px; left: 20px;
            font-size: 24px; font-weight: bold; pointer-events: none;
            text-shadow: 0 0 10px #0a84ff;
        }
        #msg {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center; display: none;
        }
        .btn-restart {
            margin-top: 20px; padding: 15px 30px;
            background: #0a84ff; border: none; color: white;
            border-radius: 30px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="ui">Score: 0</div>
    <div id="msg">
        <h1>GAME OVER</h1>
        <p id="finalScore"></p>
        <button class="btn-restart" onclick="resetGame()">Tentar Novamente</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const ui = document.getElementById('ui');
        const msg = document.getElementById('msg');
        const finalScore = document.getElementById('finalScore');

        // Configuração de tela
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Estado do Jogo
        let score = 0;
        let gameActive = true;
        let speed = 5;

        // Jogador (Inspirado no design C63/BMW)
        const player = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 120,
            w: 50,
            h: 90,
            color: '#0a84ff'
        };

        // Obstáculos
        const obstacles = [];
        function createObstacle() {
            const width = Math.random() * (canvas.width * 0.3) + 50;
            obstacles.push({
                x: Math.random() * (canvas.width - width),
                y: -100,
                w: width,
                h: 40,
                color: '#ff375f'
            });
        }

        // Controles Touch para o POCO X7 Pro
        window.addEventListener('touchmove', (e) => {
            if (!gameActive) return;
            const touchX = e.touches[0].clientX;
            player.x = touchX - player.w / 2;
            
            // Limites da tela
            if (player.x < 0) player.x = 0;
            if (player.x > canvas.width - player.w) player.x = canvas.width - player.w;
        });

        function update() {
            if (!gameActive) return;

            score++;
            ui.innerText = `Score: ${score}`;
            speed += 0.001; // Aumenta a dificuldade gradualmente

            // Criar obstáculos
            if (score % 60 === 0) createObstacle();

            // Mover obstáculos
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const o = obstacles[i];
                o.y += speed;

                // Colisão
                if (player.x < o.x + o.w &&
                    player.x + player.w > o.x &&
                    player.y < o.y + o.h &&
                    player.y + player.h > o.y) {
                    gameOver();
                }

                // Remover fora da tela
                if (o.y > canvas.height) obstacles.splice(i, 1);
            }
        }

        function draw() {
            // Fundo Dark
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Linhas da estrada (Efeito de velocidade)
            ctx.strokeStyle = '#1c1c1e';
            ctx.setLineDash([20, 20]);
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();

            // Desenhar Jogador (Design elegante)
            ctx.fillStyle = player.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = player.color;
            ctx.beginPath();
            ctx.roundRect(player.x, player.y, player.w, player.h, 10);
            ctx.fill();
            
            // Faróis
            ctx.fillStyle = 'white';
            ctx.fillRect(player.x + 5, player.y, 10, 5);
            ctx.fillRect(player.x + player.w - 15, player.y, 10, 5);

            // Desenhar Obstáculos
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ff375f';
            ctx.fillStyle = '#ff375f';
            for (const o of obstacles) {
                ctx.beginPath();
                ctx.roundRect(o.x, o.y, o.w, o.h, 5);
                ctx.fill();
            }
        }

        function loop() {
            update();
            draw();
            if (gameActive) requestAnimationFrame(loop);
        }

        function gameOver() {
            gameActive = false;
            msg.style.display = 'block';
            finalScore.innerText = `Sua pontuação final: ${score}`;
        }

        function resetGame() {
            score = 0;
            speed = 5;
            obstacles.length = 0;
            player.x = canvas.width / 2 - 25;
            gameActive = true;
            msg.style.display = 'none';
            loop();
        }

        // Iniciar
        loop();

        // Redimensionamento
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.y = canvas.height - 120;
        });
    </script>
</body>
</html>
