<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brim Dev - AppFamilia Pro</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-dark: #000000; --card-bg: #1c1c1e; --text-main: #ffffff;
            --text-secondary: #8e8e93; --accent-blue: #0a84ff; --accent-green: #30d158;
            --accent-purple: #af52de;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; background-color: var(--bg-dark); color: var(--text-main); padding: 20px; padding-bottom: 120px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .header h1 { font-size: 24px; font-weight: 600; text-transform: capitalize; }

        /* WIDGET PRINCIPAL (RING) */
        .main-widget { background: radial-gradient(circle at center, #1c1c1e 0%, #000 100%); border-radius: 35px; padding: 40px 20px; text-align: center; margin-bottom: 20px; border: 1px solid #2c2c2e; }
        .ring-container { width: 200px; height: 200px; margin: 0 auto; position: relative; }
        .balance-info { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; }
        .balance-info h2 { font-size: 24px; font-weight: 700; }
        .balance-info p { font-size: 11px; color: var(--text-secondary); margin-top: 5px; }

        /* INSIGHTS GRID */
        .insights-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .insight-card { background: var(--card-bg); border-radius: 24px; padding: 20px; height: 150px; display: flex; flex-direction: column; justify-content: space-between; }
        .insight-card h3 { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        .insight-value { font-size: 20px; font-weight: 700; }

        /* LISTA DE METAS (PLANEJAMENTO) */
        .section-title { font-size: 18px; font-weight: 600; margin-bottom: 15px; display: flex; justify-content: space-between; }
        .meta-card { background: var(--card-bg); border-radius: 20px; padding: 18px; margin-bottom: 12px; }
        .meta-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
        .progress-bar { width: 100%; height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent-purple); transition: 0.5s; }

        /* TRANSAÇÕES RECENTES */
        .transaction-list { display: flex; flex-direction: column; gap: 10px; }
        .transaction-item { background: #1c1c1e; padding: 15px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; }

        /* NAV BAR */
        .nav-bar { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); width: 92%; background: rgba(28, 28, 30, 0.9); backdrop-filter: blur(20px); border-radius: 30px; padding: 15px; display: flex; justify-content: space-around; align-items: center; border: 1px solid rgba(255,255,255,0.1); z-index: 1000; }
        .nav-btn { color: var(--text-secondary); font-size: 24px; cursor: pointer; transition: 0.3s; }
        .nav-btn.active { color: var(--text-main); }
        .add-btn { background: white; color: black; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; margin-top: -50px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }

        /* MODAL */
        #modalGeneric { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; padding: 40px 20px; }
        .modal-content { background: #1c1c1e; border-radius: 30px; padding: 30px; }
        input, select { width: 100%; padding: 16px; border-radius: 14px; border: none; background: #2c2c2e; color: white; margin-bottom: 15px; font-size: 16px; outline: none; }
        .btn-save { background: var(--accent-blue); color: white; padding: 18px; border-radius: 16px; border: none; width: 100%; font-weight: bold; }

        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="txtData">Maio 2026</h1>
        <div style="font-size: 20px;">⚙️</div>
    </div>

    <div id="viewHome" class="view active">
        <div class="main-widget">
            <div class="ring-container">
                <canvas id="balanceRing"></canvas>
                <div class="balance-info">
                    <h2 id="totalSaldo">R$ 0</h2>
                    <p>restante no mês</p>
                </div>
            </div>
        </div>

        <div class="insights-grid">
            <div class="insight-card">
                <h3>Tendência</h3>
                <div class="insight-value" id="trendVal">+0% 📈</div>
                <small style="color:var(--accent-green)">Análise Real</small>
            </div>
            <div class="insight-card">
                <h3>Taxa Poupança</h3>
                <div class="insight-value" id="saveRate">0%</div>
                <div class="progress-bar" style="margin-top:10px;"><div id="saveFill" class="progress-fill" style="width: 0%; background: var(--accent-blue);"></div></div>
            </div>
        </div>

        <div class="section-title">Transações Recentes</div>
        <div class="transaction-list" id="recentList"></div>
    </div>

    <div id="viewPlanejamento" class="view">
        <div class="section-title">Metas e Sonhos <span onclick="openModal('meta')" style="color:var(--accent-blue); cursor:pointer;">+ Nova</span></div>
        <div id="metaList"></div>
    </div>

    <nav class="nav-bar">
        <div class="nav-btn active" onclick="navTab('viewHome', this)">🏠</div>
        <div class="nav-btn" onclick="navTab('viewPlanejamento', this)">🎯</div>
        <div class="add-btn" onclick="openModal('finance')">+</div>
        <div class="nav-btn" onclick="navTab('viewHome', this)">📊</div>
        <div class="nav-btn" onclick="navTab('viewHome', this)">👤</div>
    </nav>

    <div id="modalGeneric">
        <div class="modal-content">
            <h2 id="modalTitle" style="margin-bottom: 20px;">Novo Registro</h2>
            <div id="formFinance">
                <select id="finType"><option value="gasto">🔴 Saída</option><option value="ganho">🟢 Entrada</option></select>
                <input type="text" id="finDesc" placeholder="Descrição"><input type="number" id="finValue" placeholder="Valor R$" inputmode="decimal">
                <button class="btn-save" onclick="saveFinance()">Salvar</button>
            </div>
            <div id="formMeta" style="display:none;">
                <input type="text" id="metaName" placeholder="Nome da Meta (ex: BMW GS)">
                <input type="number" id="metaTarget" placeholder="Valor Alvo R$" inputmode="decimal">
                <input type="number" id="metaCurrent" placeholder="Valor Atual R$" inputmode="decimal">
                <button class="btn-save" onclick="saveMeta()">Criar Meta</button>
            </div>
            <button onclick="closeModal()" style="background:none;border:none;color:var(--text-secondary);width:100%;margin-top:20px;">Cancelar</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGKDP5V75gMI7uO4gpZL6IpV3teP6J4ao",
            authDomain: "appfamilia-5ebe4.firebaseapp.com",
            databaseURL: "https://appfamilia-5ebe4-default-rtdb.firebaseio.com",
            projectId: "appfamilia-5ebe4",
            storageBucket: "appfamilia-5ebe4.firebasestorage.app",
            messagingSenderId: "588166444818",
            appId: "1:588166444818:web:4dcc01e0c6d1608cbc65cb"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function navTab(viewId, element) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            element.classList.add('active');
            if(viewId === 'viewPlanejamento') fetchMetas();
        }

        function openModal(mode) {
            document.getElementById('modalGeneric').style.display = 'block';
            if(mode === 'finance') {
                document.getElementById('formFinance').style.display = 'block';
                document.getElementById('formMeta').style.display = 'none';
                document.getElementById('modalTitle').innerText = "Novo Gasto/Ganho";
            } else {
                document.getElementById('formFinance').style.display = 'none';
                document.getElementById('formMeta').style.display = 'block';
                document.getElementById('modalTitle').innerText = "Planejar Meta";
            }
        }

        function closeModal() { document.getElementById('modalGeneric').style.display = 'none'; }

        // --- LÓGICA FINANCEIRA ---
        async function saveFinance() {
            const type = document.getElementById('finType').value;
            const desc = document.getElementById('finDesc').value;
            const val = parseFloat(document.getElementById('finValue').value) || 0;
            if(!desc || val <= 0) return alert("Preencha corretamente!");
            await db.ref("financas").push({ tipo: type, descricao: desc, valor: val, data: firebase.database.ServerValue.TIMESTAMP });
            closeModal();
        }

        // --- LÓGICA DE METAS ---
        async function saveMeta() {
            const name = document.getElementById('metaName').value;
            const target = parseFloat(document.getElementById('metaTarget').value) || 0;
            const current = parseFloat(document.getElementById('metaCurrent').value) || 0;
            if(!name || target <= 0) return alert("Preencha a meta!");
            await db.ref("metas").push({ nome: name, alvo: target, atual: current });
            closeModal();
            fetchMetas();
        }

        async function fetchMetas() {
            const list = document.getElementById('metaList'); list.innerHTML = '';
            const snap = await db.ref("metas").once('value');
            snap.forEach(c => {
                const m = c.val();
                const pct = Math.min(100, (m.atual / m.alvo) * 100).toFixed(1);
                list.innerHTML += `
                <div class="meta-card">
                    <div class="meta-header"><b>${m.nome}</b><span>R$ ${m.atual} / ${m.alvo}</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width: ${pct}%"></div></div>
                    <div style="font-size:10px; color:var(--text-secondary); margin-top:5px; text-align:right;">${pct}% concluído</div>
                </div>`;
            });
        }

        let ringChart;
        function renderRing(gas, total) {
            const ctx = document.getElementById('balanceRing').getContext('2d');
            if(ringChart) ringChart.destroy();
            ringChart = new Chart(ctx, {
                type: 'doughnut',
                data: { datasets: [{ data: [gas, Math.max(0, total - gas)], backgroundColor: ['#0a84ff', '#1c1c1e'], borderWidth: 0, borderRadius: 20 }] },
                options: { cutout: '85%', responsive: true, plugins: { legend: { display: false } } }
            });
        }

        window.onload = () => {
            db.ref("financas").on('value', snap => {
                let gan = 0, gas = 0;
                const list = document.getElementById('recentList'); list.innerHTML = '';
                snap.forEach(c => {
                    const f = c.val();
                    if(f.tipo === 'ganho') gan += f.valor; else gas += f.valor;
                    list.innerHTML = `<div class="transaction-item"><b>${f.descricao}</b><b style="color:${f.tipo==='ganho'?'#30d158':'#fff'}">R$ ${f.valor}</b></div>` + list.innerHTML;
                });
                const total = 5000;
                document.getElementById('totalSaldo').innerText = `R$ ${total - gas}`;
                const savePct = gan > 0 ? Math.min(100, ((gan - gas) / gan) * 100).toFixed(0) : 0;
                document.getElementById('saveRate').innerText = `${savePct}%`;
                document.getElementById('saveFill').style.width = `${savePct}%`;
                renderRing(gas, total);
            });
        };
    </script>
</body>
</html>
