<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BrimChat AI - v3.0</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-dark: #0b141a; --bg-panel: #111b21; --accent: #00a884;
            --bubble-me: #005c4b; --bubble-ai: #1e2a30; --text: #e9edef;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background: var(--bg-dark); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        .chat-header {
            background: var(--bg-panel); padding: 10px 20px;
            display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #222;
        }
        .ai-avatar {
            width: 40px; height: 40px; background: var(--accent); border-radius: 50%;
            display: grid; place-items: center; font-weight: bold; color: #000;
        }

        #chatWindow {
            flex: 1; overflow-y: auto; padding: 20px; display: flex;
            flex-direction: column; gap: 10px;
        }

        .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 15px; line-height: 1.5; position: relative; }
        .msg.me { align-self: flex-end; background: var(--bubble-me); border-top-right-radius: 2px; }
        .msg.ai { align-self: flex-start; background: var(--bubble-ai); border-top-left-radius: 2px; border: 1px solid #333; }
        
        /* Formatação de código da IA */
        .msg pre { background: #000; padding: 10px; border-radius: 8px; overflow-x: auto; margin-top: 10px; font-family: monospace; font-size: 13px; }
        .msg code { font-family: monospace; color: var(--accent); }

        .input-area { background: var(--bg-panel); padding: 10px; display: flex; align-items: center; gap: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
        #msgInput { flex: 1; background: #2a3942; border: none; padding: 15px; border-radius: 25px; color: white; outline: none; font-size: 15px; }
        .btn-send { background: var(--accent); width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; border: none; cursor: pointer; color: black; font-size: 20px; }

        #aiTyping { font-size: 12px; color: var(--accent); padding: 0 20px 10px 20px; display: none; font-style: italic; }
    </style>
</head>
<body>

    <header class="chat-header">
        <div class="ai-avatar">AI</div>
        <div>
            <b style="font-size: 16px;">Brim Assistente</b><br>
            <small style="color: var(--accent);">Online - Motor LLM Ativo</small>
        </div>
    </header>

    <div id="chatWindow"></div>
    <div id="aiTyping">Brim AI está processando...</div>

    <div class="input-area">
        <input type="text" id="msgInput" placeholder="Pergunte ou peça código..." onkeypress="if(event.key==='Enter') handleUserMessage()">
        <button class="btn-send" onclick="handleUserMessage()">➤</button>
    </div>

    <script>
        // 1. SUA CHAVE DA API AQUI (Pegue gratuitamente no Google AI Studio)
        const API_KEY = "COLOQUE_SUA_CHAVE_AQUI"; 
        
        // 2. CONFIG DO FIREBASE (A sua original)
        const firebaseConfig = {
            apiKey: "AIzaSyBGKDP5V75gMI7uO4gpZL6IpV3teP6J4ao",
            authDomain: "appfamilia-5ebe4.firebaseapp.com",
            databaseURL: "https://appfamilia-5ebe4-default-rtdb.firebaseio.com",
            projectId: "appfamilia-5ebe4",
            storageBucket: "appfamilia-5ebe4.firebasestorage.app",
            messagingSenderId: "588166444818",
            appId: "1:588166444818:web:4dcc01e0c6d1608cbc65cb"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const currentUser = "Pablo"; 

        async function handleUserMessage() {
            const input = document.getElementById('msgInput');
            const userText = input.value.trim();
            if(!userText) return;

            // Limpa o input
            input.value = "";

            // Salva a pergunta do usuário no Firebase
            await saveMessageToDB(currentUser, userText);

            // Mostra que a IA está "pensando"
            document.getElementById('aiTyping').style.display = 'block';

            try {
                // Chama a API de Inteligência Artificial
                const aiResponse = await chamarInteligenciaArtificial(userText);
                
                // Salva a resposta da IA no Firebase
                await saveMessageToDB("Brim AI", aiResponse);
            } catch (error) {
                await saveMessageToDB("Brim AI", "⚠️ Erro de conexão com a API. Verifique o console.");
                console.error(error);
            } finally {
                // Esconde o "digitando..."
                document.getElementById('aiTyping').style.display = 'none';
            }
        }

        // FUNÇÃO QUE SE COMUNICA COM O LLM (Neste caso, Gemini REST API)
        async function chamarInteligenciaArtificial(prompt) {
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${API_KEY}`;
            
            // Payload de configuração da IA (Você pode mudar o "system prompt" aqui)
            const payload = {
                contents: [{ parts: [{ text: prompt }] }]
            };

            const resposta = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!resposta.ok) throw new Error("Falha na API");
            
            const dados = await resposta.json();
            return dados.candidates[0].content.parts[0].text;
        }

        async function saveMessageToDB(user, text) {
            await db.ref("chat_inteligente").push({
                user: user,
                text: text,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
        }

        // CARREGA E RENDERIZA AS MENSAGENS EM TEMPO REAL
        function initChat() {
            const chat = document.getElementById('chatWindow');

            db.ref("chat_inteligente").orderByChild("timestamp").on('value', snap => {
                chat.innerHTML = "";
                snap.forEach(child => {
                    const m = child.val();
                    const isMe = m.user === currentUser;
                    
                    // Tratamento básico para exibir blocos de código (Markdown) no chat
                    let formattedText = m.text
                        .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>') // Formata blocos de código
                        .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>') // Formata negrito
                        .replace(/\n/g, '<br>'); // Formata quebras de linha

                    chat.innerHTML += `
                        <div class="msg ${isMe ? 'me' : 'ai'}">
                            ${formattedText}
                            <div style="font-size:9px; text-align:right; opacity:0.5; margin-top:6px;">${m.time}</div>
                        </div>
                    `;
                });
                chat.scrollTop = chat.scrollHeight; // Rola pra baixo
            });
        }

        window.onload = initChat;
    </script>
</body>
</html>
