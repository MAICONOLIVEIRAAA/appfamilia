<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AppFamilia - Maicon</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        :root { --gold: #d4af37; --dark: #121212; --gray: #1e1e1e; --light-gray: #2c2c2c; --text: #e0e0e0; --red: #e74c3c; --green: #2ecc71; --blue: #3498db; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: var(--dark); color: var(--text); }
        .app-container { padding: 15px; width: 100%; max-width: 500px; margin: 0 auto; min-height: 100vh; }
        
        .view { display: none; flex-direction: column; gap: 15px; animation: fadeIn 0.3s ease-in-out; }
        .view.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h1 { text-align: center; color: var(--gold); margin: 20px 0; font-size: 2.2em; }
        h2 { font-size: 1.2em; color: var(--gold); margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        
        .menu-grid { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .btn-menu { background: var(--gray); border: 2px solid var(--gold); color: var(--gold); padding: 20px; border-radius: 12px; font-size: 1.1em; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        .btn-back { background: transparent; color: var(--text); border: none; font-size: 1em; padding: 10px 0; cursor: pointer; display: flex; align-items: center; gap: 5px; }

        .card { background: var(--gray); padding: 20px; border-radius: 12px; border-top: 3px solid var(--gold); box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .balance-box { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; background: var(--light-gray); padding: 15px; border-radius: 10px; text-align: center; }
        .balance-item h3 { font-size: 0.7em; color: #aaa; margin-bottom: 5px; text-transform: uppercase; }
        .balance-item p { font-size: 0.85em; font-weight: bold; }
        
        .form-group { display: flex; flex-direction: column; gap: 10px; }
        select, input, button { width: 100%; padding: 14px; border-radius: 8px; border: none; font-size: 16px; outline: none; }
        input, select { background: var(--light-gray); color: white; border: 1px solid #444; }
        .btn { background: var(--gold); color: #000; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .btn-alert { background: #555; color: white; margin-bottom: 10px; font-size: 14px; }

        .item-list { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .list-item { background: var(--light-gray); padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; border-left: 4px solid #555; }
        .item-ganho { border-left-color: var(--green); }
        .item-gasto { border-left-color: var(--red); }
        .registro-data { font-size: 0.75em; color: #aaa; }
        .chart-container { position: relative; height: 200px; width: 100%; margin-top: 10px; }
        .delete-btn { font-size: 1.2em; padding-left: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <div id="viewHome" class="view active">
            <h1>AppFamilia 🏠</h1>
            <div class="menu-grid">
                <button class="btn-menu" onclick="navigateTo('viewLancamento')">➕ Lançar Valor</button>
                <button class="btn-menu" onclick="navigateTo('viewExtrato')">📊 Registros e Saldo</button>
                <button class="btn-menu" onclick="navigateTo('viewTarefas')">📝 Lembretes & Tarefas</button>
            </div>
        </div>

        <div id="viewLancamento" class="view">
            <button class="btn-back" onclick="navigateTo('viewHome')">⬅ Voltar</button>
            <div class="card">
                <h2>Registrar Ganho/Gasto</h2>
                <div class="form-group">
                    <select id="finType">
                        <option value="gasto">🔴 CADASTRAR GASTO</option>
                        <option value="ganho">🟢 CADASTRAR SALÁRIO</option>
                    </select>
                    <select id="finFreq">
                        <option value="mes">📅 Lançamento do Mês</option>
                        <option value="fixo">📌 Lançamento Fixo</option>
                    </select>
                    <input type="text" id="finDesc" placeholder="Descrição">
                    <input type="number" id="finValue" placeholder="Valor (R$)" inputmode="decimal">
                    <button class="btn" onclick="addFinance()">Salvar</button>
                </div>
            </div>
        </div>

        <div id="viewExtrato" class="view">
            <button class="btn-back" onclick="navigateTo('viewHome')">⬅ Voltar</button>
            <div class="balance-box">
                <div class="balance-item"><h3>Ganhos</h3><p id="totalGanho" style="color:var(--green)">R$ 0</p></div>
                <div class="balance-item"><h3>Saldo</h3><p id="totalSaldo">R$ 0</p></div>
                <div class="balance-item"><h3>Gastos</h3><p id="totalGasto" style="color:var(--red)">R$ 0</p></div>
            </div>
            <div class="card" style="padding: 10px;"><div class="chart-container"><canvas id="financeChart"></canvas></div></div>
            <div class="card"><h2>Meu Extrato</h2><ul id="finList" class="item-list"></ul></div>
        </div>

        <div id="viewTarefas" class="view">
            <button class="btn-back" onclick="navigateTo('viewHome')">⬅ Voltar</button>
            <div class="card">
                <h2>Lembretes</h2>
                <button class="btn btn-alert" onclick="requestNotificationPermission()">🔔 Ativar Alertas no Celular</button>
                <div class="form-group" style="margin-bottom: 15px;">
                    <input type="text" id="taskInput" placeholder="O que lembrar?">
                    <input type="time" id="taskTime"> <button class="btn" onclick="addTask()">Adicionar Lembrete</button>
                </div>
                <ul id="taskList" class="item-list"></ul>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBGKDP5V75gMI7uO4gpZL6IpV3teP6J4ao",
            authDomain: "appfamilia-5ebe4.firebaseapp.com",
            databaseURL: "https://appfamilia-5ebe4-default-rtdb.firebaseio.com",
            projectId: "appfamilia-5ebe4",
            storageBucket: "appfamilia-5ebe4.firebasestorage.app",
            messagingSenderId: "588166444818",
            appId: "1:588166444818:web:4dcc01e0c6d1608cbc65cb"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function navigateTo(viewId) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            if(viewId === 'viewExtrato') fetchFinance();
            if(viewId === 'viewTarefas') fetchTasks();
        }

        // --- NOTIFICAÇÕES ---
        function requestNotificationPermission() {
            Notification.requestPermission().then(permission => {
                if (permission === "granted") alert("Alertas ativados com sucesso!");
            });
        }

        function showNotification(msg) {
            if (Notification.permission === "granted") {
                new Notification("AppFamilia: Lembrete!", { body: msg, icon: "https://cdn-icons-png.flaticon.com/512/559/559344.png" });
            }
        }

        // Checagem de tempo (Roda a cada 1 minuto)
        setInterval(() => {
            const agora = new Date();
            const horaAtual = agora.getHours().toString().padStart(2, '0') + ":" + agora.getMinutes().toString().padStart(2, '0');
            
            db.ref("tarefas").once('value', snap => {
                snap.forEach(child => {
                    const t = child.val();
                    if (t.hora === horaAtual && !t.notificado) {
                        showNotification(t.texto);
                        db.ref("tarefas").child(child.key).update({ notificado: true });
                    }
                });
            });
        }, 60000);

        // --- FINANÇAS ---
        async function addFinance() {
            const type = document.getElementById('finType').value;
            const freq = document.getElementById('finFreq').value;
            const desc = document.getElementById('finDesc').value;
            const val = parseFloat(document.getElementById('finValue').value.replace(',', '.'));
            if (!desc || !val) return alert("Preencha tudo!");
            await db.ref("financas").push({ tipo: type, frequencia: freq, descricao: desc, valor: val, data: firebase.database.ServerValue.TIMESTAMP });
            navigateTo('viewExtrato');
        }

        let myChart;
        async function fetchFinance() {
            const snap = await db.ref("financas").orderByChild("data").once('value');
            let ganhos = 0, gastos = 0;
            const listEl = document.getElementById('finList');
            listEl.innerHTML = '';
            let regs = [];
            snap.forEach(c => { regs.push({id: c.key, ...c.val()}); if(c.val().tipo === 'ganho') ganhos += c.val().valor; else gastos += c.val().valor; });
            regs.reverse().forEach(d => {
                listEl.innerHTML += `<li class="list-item ${d.tipo==='ganho'?'item-ganho':'item-gasto'}">
                    <div><b>${d.descricao}</b><br><small>${new Date(d.data).toLocaleDateString()}</small></div>
                    <div style="display:flex;align-items:center;"><b style="color:${d.tipo==='ganho'?'var(--green)':'var(--red)'}">R$ ${d.valor.toFixed(2)}</b><span class="delete-btn" onclick="deleteRegistro('${d.id}')">🗑️</span></div>
                </li>`;
            });
            document.getElementById('totalGanho').innerText = `R$ ${ganhos.toFixed(2)}`;
            document.getElementById('totalGasto').innerText = `R$ ${gastos.toFixed(2)}`;
            document.getElementById('totalSaldo').innerText = `R$ ${(ganhos-gastos).toFixed(2)}`;
            renderChart(ganhos, gastos);
        }

        function renderChart(gan, gas) {
            const ctx = document.getElementById('financeChart').getContext('2d');
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, { type: 'pie', data: { labels: ['Salários', 'Gastos'], datasets: [{ data: [gan, gas], backgroundColor: ['#2ecc71', '#e74c3c'], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false } });
        }

        async function deleteRegistro(id) { if(confirm("Apagar?")) { await db.ref("financas").child(id).remove(); fetchFinance(); } }

        // --- TAREFAS ---
        async function addTask() {
            const val = document.getElementById('taskInput').value;
            const time = document.getElementById('taskTime').value;
            if (!val) return;
            await db.ref("tarefas").push({ texto: val, hora: time, notificado: false, data: firebase.database.ServerValue.TIMESTAMP });
            document.getElementById('taskInput').value = '';
            fetchTasks();
        }

        async function fetchTasks() {
            const snap = await db.ref("tarefas").orderByChild("data").once('value');
            const list = document.getElementById('taskList');
            list.innerHTML = '';
            let tasks = [];
            snap.forEach(c => { tasks.push({id: c.key, ...c.val()}); });
            tasks.reverse().forEach(t => {
                list.innerHTML += `<li class="list-item">
                    <span><b>${t.hora || '--:--'}</b> - ${t.texto}</span>
                    <span onclick="deleteTask('${t.id}')" style="cursor:pointer">✅</span>
                </li>`;
            });
        }

        async function deleteTask(id) { await db.ref("tarefas").child(id).remove(); fetchTasks(); }

        window.onload = () => { fetchFinance(); fetchTasks(); };
    </script>
</body>
</html>
